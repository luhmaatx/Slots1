<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="theme-color" content="#090706">

<title>KIMIA PRIVÉ</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@300;400;500;600&display=swap');

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
  background:
    radial-gradient(
      circle at 50% 18%,
      rgba(130, 88, 35, .18),
      transparent 38%
    ),
    linear-gradient(
      180deg,
      #090706 0%,
      #100b08 50%,
      #070504 100%
    );
  color: #eee2c7;
  font-family: 'Montserrat', sans-serif;
}

body {
  min-height: 100vh;
  overflow-x: hidden;
}

button {
  font: inherit;
}

#app {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding:
    calc(22px + env(safe-area-inset-top))
    18px
    calc(22px + env(safe-area-inset-bottom));
}

.screen {
  width: 100%;
  max-width: 520px;
}

.hidden {
  display: none !important;
}

/* =========================================================
   LUXURY LOGIN
========================================================= */

.login-card {
  position: relative;
  width: 100%;
  padding: 44px 30px 36px;
  border: 1px solid rgba(205, 163, 83, .42);
  border-radius: 3px;

  background:
    radial-gradient(
      circle at 50% 0%,
      rgba(177, 126, 51, .12),
      transparent 42%
    ),
    linear-gradient(
      145deg,
      rgba(25, 18, 14, .98),
      rgba(12, 9, 7, .99)
    );

  box-shadow:
    0 25px 70px rgba(0,0,0,.55),
    inset 0 0 40px rgba(211,166,76,.025);
}

.login-card::before {
  content: "";
  position: absolute;
  inset: 7px;
  border: 1px solid rgba(205,163,83,.12);
  pointer-events: none;
}

.eyebrow {
  text-align: center;
  font-size: 10px;
  letter-spacing: 7px;
  color: #c9aa67;
  margin-bottom: 18px;
}

.logo {
  text-align: center;
  font-family: 'Cormorant Garamond', serif;
  font-size: 55px;
  font-weight: 400;
  line-height: .9;
  letter-spacing: 7px;
  color: #f0e1bd;
}

.logo-sub {
  text-align: center;
  margin-top: 16px;
  font-family: 'Cormorant Garamond', serif;
  font-size: 27px;
  letter-spacing: 9px;
  color: #d7b66f;
}

.ornament {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 14px;
  margin: 25px 0 30px;
}

.ornament::before,
.ornament::after {
  content: "";
  width: 52px;
  height: 1px;
  background: linear-gradient(
    90deg,
    transparent,
    #b99655
  );
}

.ornament::after {
  background: linear-gradient(
    90deg,
    #b99655,
    transparent
  );
}

.diamond {
  width: 9px;
  height: 9px;
  transform: rotate(45deg);
  background: #c8a35b;
  box-shadow:
    0 0 13px rgba(213,170,83,.45);
}

.description {
  max-width: 330px;
  margin: 0 auto 32px;
  text-align: center;
  color: #9e9280;
  font-size: 13px;
  line-height: 1.9;
  font-weight: 300;
}

.enter-button {
  position: relative;
  width: 100%;
  height: 60px;
  border: 1px solid #d2ad60;
  border-radius: 2px;
  background:
    linear-gradient(
      180deg,
      #dcb86b 0%,
      #b88738 100%
    );
  color: #140e08;
  font-size: 15px;
  font-weight: 600;
  letter-spacing: 3px;
  cursor: pointer;
  transition:
    transform .15s ease,
    filter .15s ease,
    box-shadow .15s ease;
  box-shadow:
    0 8px 28px rgba(0,0,0,.35);
}

.enter-button:active {
  transform: scale(.985);
}

.enter-button:hover {
  filter: brightness(1.06);
  box-shadow:
    0 10px 32px rgba(191,146,67,.18);
}

.enter-button:disabled {
  opacity: .55;
  cursor: wait;
}

.status {
  min-height: 21px;
  margin-top: 18px;
  text-align: center;
  color: #ad7b7b;
  font-size: 11px;
  line-height: 1.6;
}

.status.success {
  color: #bda36d;
}

.status.loading {
  color: #aa956e;
}

/* =========================================================
   GAME
========================================================= */

.game {
  width: 100%;
}

.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 18px;
}

.brand-small {
  font-family: 'Cormorant Garamond', serif;
  font-size: 22px;
  letter-spacing: 4px;
  color: #e6d3aa;
}

.vip {
  padding: 7px 12px;
  border: 1px solid rgba(202,165,91,.4);
  font-size: 9px;
  letter-spacing: 2px;
  color: #c5a66b;
}

.balance-card {
  padding: 16px 18px;
  margin-bottom: 16px;
  border: 1px solid rgba(202,165,91,.27);
  background: rgba(20,14,10,.72);
}

.balance-label {
  font-size: 9px;
  letter-spacing: 3px;
  color: #8e816d;
}

.balance {
  margin-top: 5px;
  font-family: 'Cormorant Garamond', serif;
  font-size: 31px;
  color: #ead5a9;
}

/* =========================================================
   REELS
========================================================= */

.machine {
  position: relative;
  padding: 14px;
  border: 1px solid rgba(205,163,83,.48);
  background:
    linear-gradient(
      145deg,
      #1a120d,
      #0b0806
    );
  box-shadow:
    0 25px 60px rgba(0,0,0,.48),
    inset 0 0 35px rgba(205,163,83,.025);
}

.reels {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 7px;
}

.reel {
  display: grid;
  grid-template-rows: repeat(3, 1fr);
  aspect-ratio: .68;
  min-height: 235px;
  overflow: hidden;
  border: 1px solid rgba(199,161,91,.23);
  background:
    linear-gradient(
      180deg,
      #17100c,
      #0c0907
    );
}

.cell {
  position: relative;
  display: flex;
  justify-content: center;
  align-items: center;
  border-bottom: 1px solid rgba(202,164,91,.10);
}

.cell:last-child {
  border-bottom: 0;
}

/* =========================================================
   CUSTOM LUXURY SYMBOLS
   NO EMOJIS
========================================================= */

.symbol {
  position: relative;
  width: 42px;
  height: 42px;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* diamond */

.sym-diamond::before {
  content: "";
  width: 27px;
  height: 27px;
  transform: rotate(45deg);
  border: 2px solid #d7b56b;
  background:
    linear-gradient(
      135deg,
      rgba(230,205,145,.35),
      rgba(80,48,15,.25)
    );
  box-shadow:
    0 0 12px rgba(211,170,87,.2);
}

/* seven */

.sym-seven::before {
  content: "7";
  font-family: 'Cormorant Garamond', serif;
  font-size: 43px;
  line-height: 1;
  color: #e1c27e;
  text-shadow:
    0 0 10px rgba(211,171,90,.22);
}

/* heart */

.sym-heart::before {
  content: "♥";
  font-family: Georgia, serif;
  font-size: 35px;
  color: #bd8d73;
  text-shadow:
    0 0 10px rgba(185,119,95,.2);
}

/* rose */

.sym-rose::before {
  content: "✿";
  font-size: 35px;
  color: #b99068;
  transform: rotate(10deg);
}

/* spade */

.sym-spade::before {
  content: "♠";
  font-family: Georgia, serif;
  font-size: 39px;
  color: #d0bd96;
}

/* star */

.sym-star::before {
  content: "✦";
  font-size: 37px;
  color: #d9b86d;
  text-shadow:
    0 0 12px rgba(217,184,109,.25);
}

.cell.win {
  background:
    radial-gradient(
      circle,
      rgba(207,167,85,.17),
      transparent 68%
    );
}

.cell.win .symbol {
  transform: scale(1.16);
  filter: brightness(1.25);
}

/* =========================================================
   CONTROLS
========================================================= */

.controls {
  margin-top: 18px;
}

.bet-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 7px;
}

.bet-button {
  height: 42px;
  border: 1px solid rgba(196,157,86,.28);
  background: #120d09;
  color: #a99b83;
  font-size: 11px;
  cursor: pointer;
}

.bet-button.active {
  border-color: #cda960;
  color: #e1c68e;
  background: rgba(184,138,58,.13);
}

.spin-button {
  width: 100%;
  height: 58px;
  margin-top: 10px;
  border: 1px solid #d2ad60;
  background:
    linear-gradient(
      180deg,
      #dcb86b,
      #b78637
    );
  color: #140e08;
  font-weight: 600;
  letter-spacing: 4px;
  cursor: pointer;
}

.spin-button:disabled {
  opacity: .45;
  cursor: wait;
}

.result {
  min-height: 25px;
  margin-top: 15px;
  text-align: center;
  font-family: 'Cormorant Garamond', serif;
  font-size: 20px;
  color: #d8bb7a;
}

.menu-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-top: 15px;
}

.menu-button {
  height: 44px;
  border: 1px solid rgba(198,159,88,.25);
  background: #100b08;
  color: #958875;
  font-size: 10px;
  letter-spacing: 2px;
}

/* =========================================================
   LEADERBOARD
========================================================= */

.panel {
  margin-top: 16px;
  padding: 18px;
  border: 1px solid rgba(198,159,88,.25);
  background: rgba(15,10,7,.9);
}

.panel-title {
  margin-bottom: 14px;
  font-family: 'Cormorant Garamond', serif;
  font-size: 23px;
  letter-spacing: 3px;
  color: #d8bd82;
}

.player-row {
  display: flex;
  justify-content: space-between;
  padding: 10px 0;
  border-bottom: 1px solid rgba(198,159,88,.08);
  font-size: 11px;
  color: #a79a86;
}

.player-row:last-child {
  border-bottom: 0;
}

.rank {
  width: 35px;
  color: #c8a664;
}

.player-name {
  flex: 1;
}

.player-balance {
  color: #d1b473;
}

/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 420px) {

  #app {
    padding-left: 12px;
    padding-right: 12px;
  }

  .login-card {
    padding: 38px 22px 30px;
  }

  .logo {
    font-size: 47px;
    letter-spacing: 5px;
  }

  .logo-sub {
    font-size: 23px;
    letter-spacing: 7px;
  }

  .description {
    font-size: 12px;
  }

  .reel {
    min-height: 205px;
  }

  .symbol {
    transform: scale(.82);
  }
}
</style>
</head>

<body>

<div id="app">

  <!-- =====================================================
       LOGIN
  ====================================================== -->

  <section id="loginScreen" class="screen">

    <div class="login-card">

      <div class="eyebrow">
        WELCOME TO
      </div>

      <div class="logo">
        KIMIA
      </div>

      <div class="logo-sub">
        PRIVÉ
      </div>

      <div class="ornament">
        <span class="diamond"></span>
      </div>

      <div class="description">
        An exclusive private gaming experience.
        Your Telegram identity connects directly
        to your PRIVÉ account.
      </div>

      <button
        id="loginButton"
        class="enter-button"
        type="button">
        ENTER PRIVÉ
      </button>

      <div
        id="loginStatus"
        class="status">
      </div>

    </div>

  </section>


  <!-- =====================================================
       GAME
  ====================================================== -->

  <section id="gameScreen" class="screen game hidden">

    <div class="topbar">

      <div class="brand-small">
        KIMIA PRIVÉ
      </div>

      <div
        id="vipBadge"
        class="vip">
        PRIVÉ
      </div>

    </div>

    <div class="balance-card">

      <div class="balance-label">
        PRIVÉ BALANCE
      </div>

      <div
        id="balance"
        class="balance">
        0
      </div>

    </div>


    <div class="machine">

      <div id="reels" class="reels">

        <!-- populated by JavaScript -->

      </div>

    </div>


    <div class="controls">

      <div class="bet-row">

        <button
          class="bet-button active"
          data-bet="300"
          type="button">
          300
        </button>

        <button
          class="bet-button"
          data-bet="600"
          type="button">
          600
        </button>

        <button
          class="bet-button"
          data-bet="1500"
          type="button">
          1,500
        </button>

        <button
          class="bet-button"
          data-bet="3000"
          type="button">
          3,000
        </button>

      </div>

      <button
        id="spinButton"
        class="spin-button"
        type="button">
        SPIN
      </button>

      <div
        id="result"
        class="result">
      </div>

    </div>


    <div class="menu-row">

      <button
        id="leaderboardButton"
        class="menu-button"
        type="button">
        LEADERBOARD
      </button>

      <button
        id="logoutButton"
        class="menu-button"
        type="button">
        CLOSE
      </button>

    </div>


    <div
      id="leaderboardPanel"
      class="panel hidden">

      <div class="panel-title">
        PRIVÉ RANKINGS
      </div>

      <div id="leaderboard">
      </div>

    </div>

  </section>

</div>


<script>
"use strict";

/* =========================================================
   TELEGRAM
========================================================= */

const tg =
  window.Telegram &&
  window.Telegram.WebApp
    ? window.Telegram.WebApp
    : null;

/* =========================================================
   ELEMENTS
========================================================= */

const loginScreen =
  document.getElementById("loginScreen");

const gameScreen =
  document.getElementById("gameScreen");

const loginButton =
  document.getElementById("loginButton");

const loginStatus =
  document.getElementById("loginStatus");

const balanceElement =
  document.getElementById("balance");

const vipBadge =
  document.getElementById("vipBadge");

const reelsElement =
  document.getElementById("reels");

const spinButton =
  document.getElementById("spinButton");

const resultElement =
  document.getElementById("result");

const leaderboardButton =
  document.getElementById("leaderboardButton");

const leaderboardPanel =
  document.getElementById("leaderboardPanel");

const leaderboardElement =
  document.getElementById("leaderboard");

const logoutButton =
  document.getElementById("logoutButton");


/* =========================================================
   GAME STATE
========================================================= */

let currentBet = 300;
let player = null;
let spinning = false;


/* =========================================================
   SYMBOL MAP
========================================================= */

const SYMBOL_CLASSES = {
  "💎": "sym-diamond",
  "7️⃣": "sym-seven",
  "💗": "sym-heart",
  "🌹": "sym-rose",
  "♠️": "sym-spade",
  "✨": "sym-star",

  /*
    Compatibility with possible alternate
    server symbol values.
  */

  "7": "sym-seven",
  "heart": "sym-heart",
  "rose": "sym-rose",
  "spade": "sym-spade",
  "diamond": "sym-diamond",
  "star": "sym-star"
};


/* =========================================================
   TELEGRAM INITIALIZATION
========================================================= */

function initializeTelegram() {

  if (!tg) {
    loginStatus.textContent =
      "Open this game from Telegram to continue.";
    return;
  }

  try {
    tg.ready();

    if (typeof tg.expand === "function") {
      tg.expand();
    }

    if (tg.setHeaderColor) {
      tg.setHeaderColor("#090706");
    }

    if (tg.setBackgroundColor) {
      tg.setBackgroundColor("#090706");
    }

  } catch (error) {
    console.error(
      "Telegram initialization error:",
      error
    );
  }
}


/* =========================================================
   API
========================================================= */

async function apiRequest(
  endpoint,
  options = {}
) {

  const requestOptions = {
    method:
      options.method || "GET",

    headers: {
      "Content-Type":
        "application/json",

      ...(options.headers || {})
    }
  };

  if (
    options.body !== undefined
  ) {
    requestOptions.body =
      JSON.stringify(options.body);
  }

  const response =
    await fetch(
      endpoint,
      requestOptions
    );

  let data = null;

  try {
    data = await response.json();
  } catch {
    data = null;
  }

  if (!response.ok) {

    const message =
      data?.error ||
      `Server returned HTTP ${response.status}.`;

    throw new Error(message);
  }

  return data;
}


/* =========================================================
   TELEGRAM INIT DATA
========================================================= */

function getInitData() {

  if (!tg) {
    return "";
  }

  return (
    tg.initData ||
    ""
  );
}


/* =========================================================
   LOGIN
========================================================= */

async function login() {

  if (loginButton.disabled) {
    return;
  }

  loginStatus.className =
    "status loading";

  loginStatus.textContent =
    "CONNECTING TO PRIVÉ…";

  loginButton.disabled = true;

  try {

    /*
      IMPORTANT:
      The server verifies Telegram's signed
      initData. Do NOT send initDataUnsafe
      instead.
    */

    const initData =
      getInitData();

    if (!initData) {

      throw new Error(
        "Telegram login data is unavailable. Close the game and reopen it from the Telegram bot."
      );
    }

    const data =
      await apiRequest(
        "/api/me",
        {
          method: "POST",

          body: {
            initData: initData
          }
        }
      );

    if (
      !data ||
      data.id === undefined
    ) {
      throw new Error(
        "PRIVÉ returned an incomplete account response."
      );
    }

    player = data;

    showGame();

  } catch (error) {

    console.error(
      "LOGIN ERROR:",
      error
    );

    loginStatus.className =
      "status";

    loginStatus.textContent =
      error?.message ||
      "The server returned an invalid response.";

  } finally {

    loginButton.disabled = false;
  }
}


/* =========================================================
   SHOW GAME
========================================================= */

function showGame() {

  loginScreen.classList.add(
    "hidden"
  );

  gameScreen.classList.remove(
    "hidden"
  );

  updatePlayerUI();

  createEmptyReels();
}


/* =========================================================
   PLAYER UI
========================================================= */

function updatePlayerUI() {

  if (!player) {
    return;
  }

  balanceElement.textContent =
    Number(player.balance || 0)
      .toLocaleString();

  const vipLevel =
    Number(player.vipLevel || 0);

  vipBadge.textContent =
    vipLevel > 0
      ? `PRIVÉ VIP ${vipLevel}`
      : "PRIVÉ";
}


/* =========================================================
   SYMBOL RENDERING
========================================================= */

function symbolClass(symbol) {

  return (
    SYMBOL_CLASSES[symbol] ||
    "sym-star"
  );
}


function createSymbol(symbol) {

  const wrapper =
    document.createElement("div");

  wrapper.className =
    `symbol ${symbolClass(symbol)}`;

  /*
    The actual server symbol is kept as
    a data attribute for debugging, but
    we do not display the emoji itself.
  */

  wrapper.dataset.symbol =
    symbol;

  return wrapper;
}


/* =========================================================
   INITIAL REELS
========================================================= */

function createEmptyReels() {

  reelsElement.innerHTML = "";

  for (
    let reelIndex = 0;
    reelIndex < 5;
    reelIndex++
  ) {

    const reel =
      document.createElement("div");

    reel.className =
      "reel";

    for (
      let row = 0;
      row < 3;
      row++
    ) {

      const cell =
        document.createElement("div");

      cell.className =
        "cell";

      cell.appendChild(
        createSymbol("✦")
      );

      reel.appendChild(cell);
    }

    reelsElement.appendChild(
      reel
    );
  }
}


/* =========================================================
   RENDER SERVER RESULT
========================================================= */

function renderSpin(symbols) {

  reelsElement.innerHTML = "";

  /*
    Server returns 15 positions:

    0  3  6  9  12
    1  4  7  10  13
    2  5  8  11  14
  */

  for (
    let reelIndex = 0;
    reelIndex < 5;
    reelIndex++
  ) {

    const reel =
      document.createElement("div");

    reel.className =
      "reel";

    for (
      let row = 0;
      row < 3;
      row++
    ) {

      const index =
        reelIndex * 3 + row;

      const cell =
        document.createElement("div");

      cell.className =
        "cell";

      cell.appendChild(
        createSymbol(
          symbols[index]
        )
      );

      reel.appendChild(
        cell
      );
    }

    reelsElement.appendChild(
      reel
    );
  }
}


/* =========================================================
   WINNING LINES
========================================================= */

function highlightWinningLines(
  winningLines
) {

  if (
    !Array.isArray(winningLines)
  ) {
    return;
  }

  /*
    Server paylines:

    line 1 = top
    line 2 = middle
    line 3 = bottom
    line 4 = diagonal down
    line 5 = diagonal up
  */

  const lines = {

    1: [0, 3, 6, 9, 12],

    2: [1, 4, 7, 10, 13],

    3: [2, 5, 8, 11, 14],

    4: [0, 4, 8, 10, 12],

    5: [2, 4, 6, 10, 14]
  };

  const cells =
    document.querySelectorAll(
      ".cell"
    );

  winningLines.forEach(
    win => {

      const indexes =
        lines[win.line];

      if (!indexes) {
        return;
      }

      indexes.forEach(
        index => {

          if (cells[index]) {
            cells[index].classList.add(
              "win"
            );
          }

        }
      );
    }
  );
}


/* =========================================================
   SPIN
========================================================= */

async function spin() {

  if (
    spinning ||
    !player
  ) {
    return;
  }

  if (
    Number(player.balance) <
    currentBet
  ) {

    resultElement.textContent =
      "NOT ENOUGH PRIVÉ COINS.";

    return;
  }

  spinning = true;

  spinButton.disabled =
    true;

  resultElement.textContent =
    "SPINNING…";

  document
    .querySelectorAll(".bet-button")
    .forEach(
      button => {
        button.disabled = true;
      }
    );

  try {

    const initData =
      getInitData();

    if (!initData) {
      throw new Error(
        "Telegram session data is unavailable."
      );
    }

    const data =
      await apiRequest(
        "/api/spin",
        {
          method: "POST",

          body: {
            initData:
              initData,

            bet:
              currentBet
          }
        }
      );

    if (
      !Array.isArray(data.symbols) ||
      data.symbols.length !== 15
    ) {

      throw new Error(
        "The server returned an invalid spin result."
      );
    }

    renderSpin(
      data.symbols
    );

    highlightWinningLines(
      data.winningLines
    );

    player.balance =
      Number(data.balance);

    player.vipLevel =
      Number(data.vipLevel);

    updatePlayerUI();

    const win =
      Number(data.win || 0);

    if (win > 0) {

      resultElement.textContent =
        `WIN +${win.toLocaleString()}`;

      if (tg?.HapticFeedback) {
        try {
          tg.HapticFeedback.notificationOccurred(
            "success"
          );
        } catch {}
      }

    } else {

      resultElement.textContent =
        "NO WIN";

    }

  } catch (error) {

    console.error(
      "SPIN ERROR:",
      error
    );

    resultElement.textContent =
      error?.message ||
      "Spin failed.";

  } finally {

    spinning = false;

    spinButton.disabled =
      false;

    document
      .querySelectorAll(".bet-button")
      .forEach(
        button => {
          button.disabled = false;
        }
      );
  }
}


/* =========================================================
   BET SELECTION
========================================================= */

document
  .querySelectorAll(".bet-button")
  .forEach(
    button => {

      button.addEventListener(
        "click",
        () => {

          if (spinning) {
            return;
          }

          currentBet =
            Number(
              button.dataset.bet
            );

          document
            .querySelectorAll(
              ".bet-button"
            )
            .forEach(
              other => {
                other.classList.remove(
                  "active"
                );
              }
            );

          button.classList.add(
            "active"
          );

          resultElement.textContent =
            "";
        }
      );

    }
  );


/* =========================================================
   LEADERBOARD
========================================================= */

async function loadLeaderboard() {

  leaderboardPanel.classList.remove(
    "hidden"
  );

  leaderboardElement.innerHTML =
    `<div class="status loading">LOADING…</div>`;

  try {

    const data =
      await apiRequest(
        "/api/leaderboard"
      );

    const players =
      Array.isArray(data.players)
        ? data.players
        : [];

    if (!players.length) {

      leaderboardElement.innerHTML =
        `<div class="status">NO PLAYERS YET.</div>`;

      return;
    }

    leaderboardElement.innerHTML =
      "";

    players.forEach(
      player => {

        const row =
          document.createElement(
            "div"
          );

        row.className =
          "player-row";

        row.innerHTML = `
          <div class="rank">
            #${player.rank}
          </div>

          <div class="player-name">
            ${escapeHTML(
              player.username ||
              "PRIVÉ Player"
            )}
          </div>

          <div class="player-balance">
            ${Number(
              player.balance || 0
            ).toLocaleString()}
          </div>
        `;

        leaderboardElement.appendChild(
          row
        );
      }
    );

  } catch (error) {

    console.error(
      "LEADERBOARD ERROR:",
      error
    );

    leaderboardElement.innerHTML =
      `<div class="status">
        ${escapeHTML(
          error?.message ||
          "Unable to load leaderboard."
        )}
      </div>`;
  }
}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value) {

  return String(value)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );
}


/* =========================================================
   EVENTS
========================================================= */

loginButton.addEventListener(
  "click",
  login
);

spinButton.addEventListener(
  "click",
  spin
);

leaderboardButton.addEventListener(
  "click",
  loadLeaderboard
);

logoutButton.addEventListener(
  "click",
  () => {

    if (tg) {
      try {
        tg.close();
      } catch {}
    }

  }
);


/* =========================================================
   START
========================================================= */

initializeTelegram();

/*
  We intentionally DO NOT automatically call login here.
  The user presses ENTER PRIVÉ, which makes it much easier
  to diagnose Telegram WebApp initialization problems.
*/

</script>
