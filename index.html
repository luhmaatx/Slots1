<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090706">
<title>KIMIA PRIVÉ</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@400;500;600&display=swap');

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  min-height:100%;
  background:
    radial-gradient(circle at 50% 20%,rgba(145,104,42,.16),transparent 38%),
    linear-gradient(145deg,#080605,#120d09 48%,#070605);
  color:#ead9b5;
  font-family:Montserrat,Arial,sans-serif;
}

body{
  min-height:100dvh;
}

button{
  font:inherit;
}

.app{
  width:100%;
  min-height:100dvh;
  display:flex;
  justify-content:center;
  align-items:flex-start;
  padding:18px;
}

.screen{
  width:min(620px,100%);
  max-height:96dvh;
  overflow:auto;
  scrollbar-width:none;
}

.screen::-webkit-scrollbar{
  display:none;
}

.card{
  position:relative;
  border:1px solid rgba(205,164,82,.48);
  background:
    linear-gradient(145deg,rgba(31,22,16,.97),rgba(10,8,6,.98));
  box-shadow:
    0 0 0 1px rgba(255,255,255,.025) inset,
    0 25px 70px rgba(0,0,0,.6),
    0 0 45px rgba(158,113,42,.08);
}

.card:before{
  content:"";
  position:absolute;
  inset:8px;
  border:1px solid rgba(206,165,83,.10);
  pointer-events:none;
}

.hidden{
  display:none!important;
}

/* LOGIN */

.login-card{
  padding:48px 30px 32px;
  text-align:center;
}

.eyebrow{
  font-size:10px;
  letter-spacing:8px;
  color:#c9a65d;
  margin-bottom:14px;
}

.brand{
  font-family:"Cormorant Garamond",serif;
  font-size:58px;
  line-height:.9;
  letter-spacing:7px;
  color:#f0e1c3;
  margin-left:7px;
}

.brand-sub{
  margin-top:15px;
  font-family:"Cormorant Garamond",serif;
  font-size:28px;
  letter-spacing:11px;
  color:#d5b56d;
  margin-left:11px;
}

.ornament{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:16px;
  margin:30px 0 28px;
  color:#cba45b;
}

.ornament:before,
.ornament:after{
  content:"";
  width:35px;
  height:1px;
  background:linear-gradient(90deg,transparent,#b9934e);
}

.ornament:after{
  background:linear-gradient(90deg,#b9934e,transparent);
}

.diamond{
  transform:rotate(45deg);
  width:9px;
  height:9px;
  background:#c9a45a;
  box-shadow:0 0 14px rgba(215,175,91,.45);
}

.description{
  max-width:360px;
  margin:0 auto 31px;
  color:#a99b87;
  font-size:13px;
  line-height:1.8;
}

.primary-btn,
.spin-btn{
  position:relative;
  width:100%;
  min-height:58px;
  border:1px solid #e0bc6c;
  background:linear-gradient(180deg,#e0bd70,#b9893b);
  color:#160f09;
  font-weight:600;
  letter-spacing:3px;
  cursor:pointer;
  box-shadow:
    0 8px 24px rgba(0,0,0,.35),
    inset 0 1px rgba(255,255,255,.3);
}

.primary-btn:active,
.spin-btn:active{
  transform:translateY(1px);
}

.primary-btn:disabled,
.spin-btn:disabled{
  opacity:.55;
  cursor:wait;
}

.status{
  min-height:20px;
  margin-top:20px;
  font-size:12px;
  line-height:1.6;
  color:#b88e8e;
}

/* GAME */

.game-screen{
  width:min(620px,100%);
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:14px;
}

.logo-small{
  font-family:"Cormorant Garamond",serif;
  font-size:25px;
  letter-spacing:4px;
  color:#e8d4aa;
}

.vip{
  border:1px solid rgba(205,164,82,.4);
  padding:7px 12px;
  font-size:9px;
  letter-spacing:2px;
  color:#d3ae63;
}

/* BALANCE */

.balance-card{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:16px 18px;
  margin-bottom:14px;
}

.balance-label{
  font-size:9px;
  letter-spacing:3px;
  color:#887b69;
}

.balance{
  margin-top:5px;
  font-family:"Cormorant Garamond",serif;
  font-size:30px;
  color:#e8c979;
}

.player-name{
  max-width:160px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  text-align:right;
}

/* REELS */

.reel-card{
  padding:18px;
}

.collection-title{
  text-align:center;
  margin:0 0 18px;
  font-size:9px;
  letter-spacing:5px;
  color:#a99168;
}

.reels{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:7px;
}

.reel{
  aspect-ratio:1/1.22;
  min-width:0;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  border:1px solid rgba(204,163,80,.3);
  background:
    radial-gradient(circle at 50% 40%,rgba(145,104,42,.12),transparent 60%),
    #0c0907;
}

.symbol{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
}

.symbol:before{
  content:"";
  width:68%;
  height:68%;
  border:1px solid rgba(202,164,87,.22);
  transform:rotate(45deg);
  position:absolute;
}

.symbol-art{
  position:relative;
  z-index:2;
  font-family:"Cormorant Garamond",serif;
  font-weight:600;
  font-size:35px;
  line-height:1;
  color:#e7c77b;
  text-shadow:
    0 0 9px rgba(219,183,102,.35),
    0 2px 3px #000;
}

.symbol-diamond .symbol-art{
  font-size:32px;
}

.symbol-seven .symbol-art{
  font-size:42px;
  font-style:italic;
}

.symbol-heart .symbol-art{
  font-size:36px;
}

.symbol-rose .symbol-art{
  font-size:32px;
}

.symbol-spade .symbol-art{
  font-size:38px;
}

.symbol-star .symbol-art{
  font-size:32px;
}

/* CONTROLS */

.controls{
  margin-top:16px;
}

.bet-row{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:7px;
  margin-bottom:10px;
}

.bet-btn{
  border:1px solid rgba(205,164,82,.32);
  background:#100c09;
  color:#c7b28e;
  padding:11px 4px;
  font-size:10px;
  letter-spacing:1px;
  cursor:pointer;
}

.bet-btn.active{
  border-color:#d4ad5f;
  color:#ebd18e;
  background:rgba(181,139,61,.14);
}

.spin-btn{
  height:58px;
}

.message{
  min-height:25px;
  text-align:center;
  margin-top:13px;
  color:#c9aa70;
  font-size:12px;
}

.small-error{
  color:#bc8f8f;
  font-size:11px;
  line-height:1.5;
  text-align:center;
  margin-top:8px;
}

/* TOP PLAYERS */

.leaderboard-card{
  margin-top:14px;
  padding:22px 18px 18px;
}

.section-heading{
  text-align:center;
  font-family:"Cormorant Garamond",serif;
  font-size:25px;
  letter-spacing:4px;
  color:#e8d4aa;
}

.section-subtitle{
  text-align:center;
  margin-top:5px;
  font-size:8px;
  letter-spacing:3px;
  color:#887b69;
}

.leaderboard{
  margin-top:18px;
  display:flex;
  flex-direction:column;
  gap:7px;
}

.player-row{
  min-height:58px;
  display:grid;
  grid-template-columns:38px 1fr auto;
  align-items:center;
  gap:10px;
  padding:9px 11px;
  border:1px solid rgba(205,164,82,.18);
  background:rgba(10,8,6,.65);
}

.player-row.me{
  border-color:rgba(218,180,91,.65);
  background:rgba(181,139,61,.09);
}

.rank{
  width:30px;
  height:30px;
  display:flex;
  align-items:center;
  justify-content:center;
  border:1px solid rgba(205,164,82,.25);
  font-family:"Cormorant Garamond",serif;
  font-size:17px;
  color:#d9b76d;
}

.player-info{
  min-width:0;
}

.player-username{
  color:#dfcfad;
  font-size:11px;
  font-weight:500;
  letter-spacing:1px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.player-tag{
  margin-top:3px;
  color:#746957;
  font-size:7px;
  letter-spacing:2px;
}

.player-balance{
  text-align:right;
  font-family:"Cormorant Garamond",serif;
  font-size:18px;
  color:#dcbf79;
  white-space:nowrap;
}

.leaderboard-footer{
  margin-top:14px;
  text-align:center;
  color:#756958;
  font-size:8px;
  letter-spacing:2px;
}

.refresh-dot{
  display:inline-block;
  width:5px;
  height:5px;
  border-radius:50%;
  background:#c9a45a;
  margin-right:5px;
  vertical-align:middle;
}

.leaderboard-loading,
.leaderboard-empty{
  padding:20px;
  text-align:center;
  color:#817564;
  font-size:10px;
  letter-spacing:1px;
}

/* QUICK FEATURES */

.feature-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
  margin-top:14px;
}

.feature-card{
  min-height:76px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  border:1px solid rgba(205,164,82,.24);
  background:rgba(12,9,7,.8);
  cursor:pointer;
}

.feature-icon{
  font-family:"Cormorant Garamond",serif;
  font-size:22px;
  color:#d9b66b;
}

.feature-title{
  margin-top:5px;
  font-size:8px;
  letter-spacing:2px;
  color:#bba27a;
}

.feature-card:active{
  transform:scale(.99);
}

/* MOBILE */

@media(max-width:430px){

  .app{
    padding:10px;
  }

  .login-card{
    padding:40px 22px 27px;
  }

  .brand{
    font-size:49px;
  }

  .brand-sub{
    font-size:25px;
  }

  .symbol-art{
    font-size:28px;
  }

  .symbol-seven .symbol-art{
    font-size:34px;
  }

  .leaderboard-card{
    padding:20px 12px 15px;
  }

  .player-row{
    grid-template-columns:34px 1fr auto;
    padding:8px;
  }

  .player-balance{
    font-size:16px;
  }
}
</style>
</head>

<body>

<div class="app">

  <!-- LOGIN -->

  <main id="loginScreen" class="screen">

    <section class="card login-card">

      <div class="eyebrow">WELCOME TO</div>

      <div class="brand">KIMIA</div>
      <div class="brand-sub">PRIVÉ</div>

      <div class="ornament">
        <span class="diamond"></span>
      </div>

      <p class="description">
        An exclusive private gaming experience.
        Your Telegram identity connects directly
        to your PRIVÉ account.
      </p>

      <button id="loginBtn" class="primary-btn">
        ENTER PRIVÉ
      </button>

      <div id="loginStatus" class="status"></div>

    </section>

  </main>


  <!-- GAME -->

  <main id="gameScreen" class="screen game-screen hidden">

    <div class="topbar">

      <div class="logo-small">
        KIMIA PRIVÉ
      </div>

      <div id="vipBadge" class="vip">
        PRIVÉ
      </div>

    </div>


    <!-- BALANCE -->

    <section class="card balance-card">

      <div>

        <div class="balance-label">
          PRIVATE BALANCE
        </div>

        <div id="balance" class="balance">
          0
        </div>

      </div>

      <div
        id="playerName"
        class="balance-label player-name"
      >
        MEMBER
      </div>

    </section>


    <!-- SLOT MACHINE -->

    <section class="card reel-card">

      <div class="collection-title">
        PRIVÉ COLLECTION
      </div>

      <div id="reels" class="reels"></div>

      <div class="controls">

        <div class="bet-row">

          <button
            class="bet-btn active"
            data-bet="300"
          >
            300
          </button>

          <button
            class="bet-btn"
            data-bet="600"
          >
            600
          </button>

          <button
            class="bet-btn"
            data-bet="1500"
          >
            1,500
          </button>

          <button
            class="bet-btn"
            data-bet="3000"
          >
            3,000
          </button>

        </div>

        <button
          id="spinBtn"
          class="spin-btn"
        >
          SPIN
        </button>

        <div
          id="gameMessage"
          class="message"
        ></div>

      </div>

    </section>


    <!-- TOP PLAYERS -->

    <section class="card leaderboard-card">

      <div class="section-heading">
        TOP PLAYERS
      </div>

      <div class="section-subtitle">
        PRIVÉ LEADERBOARD
      </div>

      <div
        id="leaderboard"
        class="leaderboard"
      >

        <div class="leaderboard-loading">
          LOADING PRIVATE RANKINGS…
        </div>

      </div>

      <div class="leaderboard-footer">
        <span class="refresh-dot"></span>
        LIVE PRIVATE RANKINGS
      </div>

    </section>


    <!-- QUICK FEATURES -->

    <div class="feature-grid">

      <div
        id="rewardsBtn"
        class="card feature-card"
      >
        <div class="feature-icon">✦</div>
        <div class="feature-title">
          REWARDS
        </div>
      </div>

      <div
        id="giftingBtn"
        class="card feature-card"
      >
        <div class="feature-icon">♢</div>
        <div class="feature-title">
          GIFTING
        </div>
      </div>

    </div>


    <div
      id="featureMessage"
      class="message"
    ></div>

  </main>

</div>


<script>
(function(){

  "use strict";


  /* =====================================================
     TELEGRAM
  ===================================================== */

  const tg =
    window.Telegram &&
    window.Telegram.WebApp
      ? window.Telegram.WebApp
      : null;

  if(tg){

    try{

      tg.ready();
      tg.expand();
      tg.enableClosingConfirmation();

    }catch(e){

      console.warn(
        "Telegram WebApp setup:",
        e
      );

    }

  }


  /* =====================================================
     DOM
  ===================================================== */

  const loginScreen =
    document.getElementById(
      "loginScreen"
    );

  const gameScreen =
    document.getElementById(
      "gameScreen"
    );

  const loginBtn =
    document.getElementById(
      "loginBtn"
    );

  const loginStatus =
    document.getElementById(
      "loginStatus"
    );

  const balanceEl =
    document.getElementById(
      "balance"
    );

  const playerNameEl =
    document.getElementById(
      "playerName"
    );

  const vipBadge =
    document.getElementById(
      "vipBadge"
    );

  const reelsEl =
    document.getElementById(
      "reels"
    );

  const spinBtn =
    document.getElementById(
      "spinBtn"
    );

  const gameMessage =
    document.getElementById(
      "gameMessage"
    );

  const leaderboardEl =
    document.getElementById(
      "leaderboard"
    );

  const featureMessage =
    document.getElementById(
      "featureMessage"
    );


  let selectedBet = 300;
  let currentPlayer = null;
  let spinning = false;


  /* =====================================================
     API
  ===================================================== */

  async function apiPost(
    endpoint,
    body
  ){

    const response =
      await fetch(
        endpoint,
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json",

            "Accept":
              "application/json"
          },

          body:
            JSON.stringify(body)
        }
      );


    const text =
      await response.text();


    let data = null;


    if(text){

      try{

        data =
          JSON.parse(text);

      }catch(error){

        throw new Error(
          "Server returned invalid JSON."
        );

      }

    }


    if(!response.ok){

      const serverError =
        data && data.error
          ? data.error
          : `Server returned HTTP ${response.status}.`;

      throw new Error(
        serverError
      );

    }


    if(!data){

      throw new Error(
        "Server returned an empty response."
      );

    }


    return data;

  }


  /* =====================================================
     API GET
  ===================================================== */

  async function apiGet(endpoint){

    const response =
      await fetch(
        endpoint,
        {
          method:"GET",
          headers:{
            "Accept":
              "application/json"
          }
        }
      );


    const text =
      await response.text();


    let data = null;


    if(text){

      try{

        data =
          JSON.parse(text);

      }catch(error){

        throw new Error(
          "Server returned invalid JSON."
        );

      }

    }


    if(!response.ok){

      const serverError =
        data && data.error
          ? data.error
          : `Server returned HTTP ${response.status}.`;

      throw new Error(
        serverError
      );

    }


    if(!data){

      throw new Error(
        "Server returned an empty response."
      );

    }


    return data;

  }


  /* =====================================================
     TELEGRAM INIT DATA
  ===================================================== */

  function getInitData(){

    if(!tg){

      throw new Error(
        "Telegram WebApp is not available."
      );

    }


    const initData =
      tg.initData;


    if(!initData){

      throw new Error(
        "Telegram did not provide login data. Open the game from the Telegram bot."
      );

    }


    return initData;

  }


  /* =====================================================
     LOGIN
  ===================================================== */

  async function login(){

    if(loginBtn.disabled){

      return;

    }


    loginBtn.disabled = true;

    loginBtn.textContent =
      "CONNECTING…";

    loginStatus.textContent =
      "";


    try{

      const initData =
        getInitData();


      const data =
        await apiPost(
          "/api/me",
          {
            initData:
              initData
          }
        );


      if(
        !data ||
        typeof data !== "object"
      ){

        throw new Error(
          "The server returned an incomplete account response."
        );

      }


      if(
        data.id === undefined ||
        data.balance === undefined
      ){

        throw new Error(
          "The server returned an incomplete account response."
        );

      }


      currentPlayer =
        data;


      updatePlayer(data);


      loginScreen.classList.add(
        "hidden"
      );

      gameScreen.classList.remove(
        "hidden"
      );


      loginStatus.textContent =
        "";


      /*
        Load leaderboard after the
        account itself is working.
      */

      loadLeaderboard();


    }catch(error){

      console.error(
        "LOGIN ERROR:",
        error
      );


      loginStatus.textContent =
        error &&
        error.message
          ? error.message
          : "Login failed.";


    }finally{

      loginBtn.disabled =
        false;

      loginBtn.textContent =
        "ENTER PRIVÉ";

    }

  }


  /* =====================================================
     PLAYER DISPLAY
  ===================================================== */

  function updatePlayer(player){

    const balance =
      Number(
        player.balance
      );


    balanceEl.textContent =
      Number.isFinite(balance)
        ? balance.toLocaleString()
        : "0";


    let name =
      player.username ||
      player.first_name ||
      "PRIVÉ MEMBER";


    if(
      typeof name === "string" &&
      name.startsWith("@")
    ){

      name =
        name.substring(1);

    }


    playerNameEl.textContent =
      String(name).toUpperCase();


    const vip =
      Number(
        player.vipLevel || 0
      );


    if(vip > 0){

      vipBadge.textContent =
        `VIP ${vip}`;

    }else{

      vipBadge.textContent =
        "PRIVÉ";

    }

  }


  /* =====================================================
     SYMBOL ART
  ===================================================== */

  function symbolClass(symbol){

    if(symbol === "💎")
      return "symbol-diamond";

    if(symbol === "7️⃣")
      return "symbol-seven";

    if(symbol === "💗")
      return "symbol-heart";

    if(symbol === "🌹")
      return "symbol-rose";

    if(symbol === "♠️")
      return "symbol-spade";

    if(symbol === "✨")
      return "symbol-star";

    return "symbol-star";

  }


  function symbolMarkup(symbol){

    let art = "✦";


    if(symbol === "💎")
      art = "◆";


    if(symbol === "7️⃣")
      art = "7";


    if(symbol === "💗")
      art = "♥";


    if(symbol === "🌹")
      art = "✿";


    if(symbol === "♠️")
      art = "♠";


    if(symbol === "✨")
      art = "✦";


    return `
      <div class="symbol ${symbolClass(symbol)}">
        <span class="symbol-art">${art}</span>
      </div>
    `;

  }


  /* =====================================================
     REELS
  ===================================================== */

  function renderSymbols(symbols){

    reelsEl.innerHTML = "";


    if(
      !Array.isArray(symbols) ||
      symbols.length !== 15
    ){

      for(
        let i = 0;
        i < 15;
        i++
      ){

        const reel =
          document.createElement(
            "div"
          );


        reel.className =
          "reel";


        reel.innerHTML =
          symbolMarkup("✨");


        reelsEl.appendChild(
          reel
        );

      }


      return;

    }


    symbols.forEach(
      symbol => {

        const reel =
          document.createElement(
            "div"
          );


        reel.className =
          "reel";


        reel.innerHTML =
          symbolMarkup(symbol);


        reelsEl.appendChild(
          reel
        );

      }
    );

  }


  /* =====================================================
     INITIAL REELS
  ===================================================== */

  renderSymbols([

    "💎","7️⃣","💗","🌹","♠️",

    "✨","💎","♥","🌹","♠️",

    "7️⃣","💗","✨","💎","🌹"

  ]);


  /* =====================================================
     LEADERBOARD
  ===================================================== */

  function getLeaderboardArray(data){

    if(Array.isArray(data))
      return data;

    if(data && Array.isArray(data.players))
      return data.players;

    if(data && Array.isArray(data.leaderboard))
      return data.leaderboard;

    if(data && Array.isArray(data.topPlayers))
      return data.topPlayers;

    if(data && Array.isArray(data.data))
      return data.data;

    return [];

  }


  function playerDisplayName(player){

    let name =
      player.username ||
      player.first_name ||
      player.name ||
      "PRIVÉ MEMBER";


    if(
      typeof name === "string" &&
      name.startsWith("@")
    ){

      name =
        name.substring(1);

    }


    return String(name);

  }


  function playerBalance(player){

    const value =
      Number(
        player.balance ??
        player.coins ??
        player.credits ??
        0
      );


    return Number.isFinite(value)
      ? value
      : 0;

  }


  function isCurrentPlayer(player){

    if(!currentPlayer)
      return false;


    const currentId =
      String(
        currentPlayer.id ??
        currentPlayer.user_id ??
        currentPlayer.telegram_id ??
        ""
      );


    const playerId =
      String(
        player.id ??
        player.user_id ??
        player.telegram_id ??
        ""
      );


    return(
      currentId &&
      playerId &&
      currentId === playerId
    );

  }


  function renderLeaderboard(players){

    leaderboardEl.innerHTML = "";


    if(
      !Array.isArray(players) ||
      players.length === 0
    ){

      leaderboardEl.innerHTML = `
        <div class="leaderboard-empty">
          NO PRIVATE RANKINGS AVAILABLE
        </div>
      `;

      return;

    }


    /*
      Sort by balance when the server
      does not already provide ranking.
    */

    const sorted =
      [...players]
        .sort(
          (a,b) =>
            playerBalance(b) -
            playerBalance(a)
        )
        .slice(0,10);


    sorted.forEach(
      (player,index) => {

        const row =
          document.createElement(
            "div"
          );


        row.className =
          "player-row";


        if(
          isCurrentPlayer(player)
        ){

          row.classList.add(
            "me"
          );

        }


        let medal =
          String(index + 1);


        if(index === 0)
          medal = "♛";

        if(index === 1)
          medal = "◆";

        if(index === 2)
          medal = "✦";


        const balance =
          playerBalance(player);


        row.innerHTML = `

          <div class="rank">
            ${medal}
          </div>

          <div class="player-info">

            <div class="player-username">
              ${escapeHtml(
                playerDisplayName(player)
              )}
            </div>

            <div class="player-tag">
              ${isCurrentPlayer(player)
                ? "YOU · CURRENT MEMBER"
                : `RANK ${index + 1}`
              }
            </div>

          </div>

          <div class="player-balance">
            ${balance.toLocaleString()}
          </div>

        `;


        leaderboardEl.appendChild(
          row
        );

      }
    );

  }


  function escapeHtml(value){

    return String(value)
      .replace(/&/g,"&amp;")
      .replace(/</g,"&lt;")
      .replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;")
      .replace(/'/g,"&#039;");

  }


  async function loadLeaderboard(){

    leaderboardEl.innerHTML = `
      <div class="leaderboard-loading">
        LOADING PRIVATE RANKINGS…
      </div>
    `;


    /*
      The existing backend may expose
      the leaderboard using one of these
      routes. Try the standard route first.
    */

    const endpoints = [
      "/api/leaderboard",
      "/api/top-players"
    ];


    for(
      const endpoint of endpoints
    ){

      try{

        const data =
          await apiGet(endpoint);


        const players =
          getLeaderboardArray(data);


        if(players.length > 0){

          renderLeaderboard(
            players
          );

          return;

        }

      }catch(error){

        console.warn(
          "Leaderboard endpoint unavailable:",
          endpoint,
          error
        );

      }

    }


    /*
      Important:
      Leaderboard failure does NOT
      break the game.
    */

    leaderboardEl.innerHTML = `
      <div class="leaderboard-empty">
        PRIVATE RANKINGS WILL APPEAR HERE
      </div>
    `;

  }


  /* =====================================================
     BET SELECTION
  ===================================================== */

  document
    .querySelectorAll(".bet-btn")
    .forEach(
      button => {

        button.addEventListener(
          "click",
          () => {

            if(spinning)
              return;


            document
              .querySelectorAll(
                ".bet-btn"
              )
              .forEach(
                btn =>
                  btn.classList.remove(
                    "active"
                  )
              );


            button.classList.add(
              "active"
            );


            selectedBet =
              Number(
                button.dataset.bet
              );


            gameMessage.textContent =
              `BET ${selectedBet.toLocaleString()}`;

          }
        );

      }
    );


  /* =====================================================
     SPIN
  ===================================================== */

  async function spin(){

    if(spinning)
      return;


    spinning = true;

    spinBtn.disabled =
      true;

    spinBtn.textContent =
      "SPINNING…";

    gameMessage.textContent =
      "";


    let animation = null;


    try{

      const initData =
        getInitData();


      let animationCount = 0;


      animation =
        setInterval(
          () => {

            const fakeSymbols =
              Array.from(
                {length:15},
                () => {

                  const choices = [
                    "💎",
                    "7️⃣",
                    "💗",
                    "🌹",
                    "♠️",
                    "✨"
                  ];


                  return choices[
                    Math.floor(
                      Math.random() *
                      choices.length
                    )
                  ];

                }
              );


            renderSymbols(
              fakeSymbols
            );


            animationCount++;


            if(animationCount >= 8){

              clearInterval(
                animation
              );

            }

          },
          90
        );


      const data =
        await apiPost(
          "/api/spin",
          {
            initData:
              initData,

            bet:
              selectedBet
          }
        );


      if(
        !data ||
        !Array.isArray(
          data.symbols
        )
      ){

        throw new Error(
          "The server returned an incomplete spin response."
        );

      }


      if(animation){

        clearInterval(
          animation
        );

      }


      renderSymbols(
        data.symbols
      );


      if(
        data.balance !== undefined
      ){

        currentPlayer = {
          ...currentPlayer,
          balance:
            data.balance,
          vipLevel:
            data.vipLevel ??
            currentPlayer.vipLevel,
          username:
            data.username ??
            currentPlayer.username
        };


        updatePlayer(
          currentPlayer
        );

      }


      const win =
        Number(
          data.win || 0
        );


      if(win > 0){

        gameMessage.textContent =
          `WIN · ${win.toLocaleString()} PRIVÉ COINS`;

      }else{

        gameMessage.textContent =
          "NO WIN · TRY AGAIN";

      }


      /*
        Refresh leaderboard after
        every successful spin.
      */

      loadLeaderboard();


    }catch(error){

      if(animation){

        clearInterval(
          animation
        );

      }


      console.error(
        "SPIN ERROR:",
        error
      );


      gameMessage.textContent =
        error &&
        error.message
          ? error.message
          : "Spin failed.";

    }finally{

      setTimeout(
        () => {

          spinning = false;

          spinBtn.disabled =
            false;

          spinBtn.textContent =
            "SPIN";

        },
        350
      );

    }

  }


  /* =====================================================
     QUICK FEATURE BUTTONS
  ===================================================== */

  document
    .getElementById("rewardsBtn")
    .addEventListener(
      "click",
      () => {

        featureMessage.textContent =
          "REWARDS · COMING NEXT";

      }
    );


  document
    .getElementById("giftingBtn")
    .addEventListener(
      "click",
      () => {

        featureMessage.textContent =
          "GIFTING · COMING NEXT";

      }
    );


  /* =====================================================
     BUTTONS
  ===================================================== */

  loginBtn.addEventListener(
    "click",
    login
  );


  spinBtn.addEventListener(
    "click",
    spin
  );


  /* =====================================================
     AUTO LOGIN
  ===================================================== */

  window.addEventListener(
    "load",
    () => {

      if(
        tg &&
        tg.initData
      ){

        setTimeout(
          login,
          150
        );

      }

    }
  );


})();
</script>

</body>
  </html>
