<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090706">
<title>KIMIA PRIVÉ</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@400;500;600&display=swap');

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  min-height:100%;
  background:
    radial-gradient(circle at 50% 25%,rgba(145,104,42,.16),transparent 38%),
    linear-gradient(145deg,#080605,#120d09 48%,#070605);
  color:#ead9b5;
  font-family:Montserrat,Arial,sans-serif;
}

body{
  min-height:100dvh;
}

button{
  font:inherit;
}

.app{
  width:100%;
  min-height:100dvh;
  display:flex;
  justify-content:center;
  align-items:flex-start;
  padding:18px;
}

.screen{
  width:min(500px,100%);
  max-height:96dvh;
  overflow:auto;
  scrollbar-width:none;
}

.screen::-webkit-scrollbar{
  display:none;
}

.card{
  position:relative;
  border:1px solid rgba(205,164,82,.48);
  background:
    linear-gradient(145deg,rgba(31,22,16,.97),rgba(10,8,6,.98));
  box-shadow:
    0 0 0 1px rgba(255,255,255,.025) inset,
    0 25px 70px rgba(0,0,0,.6),
    0 0 45px rgba(158,113,42,.08);
}

.card:before{
  content:"";
  position:absolute;
  inset:8px;
  border:1px solid rgba(206,165,83,.10);
  pointer-events:none;
}

.login-card{
  padding:48px 30px 32px;
  text-align:center;
}

.eyebrow{
  font-size:10px;
  letter-spacing:8px;
  color:#c9a65d;
  margin-bottom:14px;
}

.brand{
  font-family:"Cormorant Garamond",serif;
  font-size:58px;
  line-height:.9;
  letter-spacing:7px;
  color:#f0e1c3;
  margin-left:7px;
}

.brand-sub{
  margin-top:15px;
  font-family:"Cormorant Garamond",serif;
  font-size:28px;
  letter-spacing:11px;
  color:#d5b56d;
  margin-left:11px;
}

.ornament{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:16px;
  margin:30px 0 28px;
}

.ornament:before,
.ornament:after{
  content:"";
  width:35px;
  height:1px;
  background:linear-gradient(90deg,transparent,#b9934e);
}

.ornament:after{
  background:linear-gradient(90deg,#b9934e,transparent);
}

.diamond{
  transform:rotate(45deg);
  width:9px;
  height:9px;
  background:#c9a45a;
  box-shadow:0 0 14px rgba(215,175,91,.45);
}

.description{
  max-width:360px;
  margin:0 auto 31px;
  color:#a99b87;
  font-size:13px;
  line-height:1.8;
}

.primary-btn{
  width:100%;
  min-height:58px;
  border:1px solid #e0bc6c;
  background:linear-gradient(180deg,#e0bd70,#b9893b);
  color:#160f09;
  font-weight:600;
  letter-spacing:3px;
  cursor:pointer;
  box-shadow:
    0 8px 24px rgba(0,0,0,.35),
    inset 0 1px rgba(255,255,255,.3);
}

.primary-btn:active{
  transform:translateY(1px);
}

.primary-btn:disabled{
  opacity:.55;
  cursor:wait;
}

.status{
  min-height:20px;
  margin-top:20px;
  font-size:12px;
  line-height:1.6;
  color:#b88e8e;
}

.hidden{
  display:none!important;
}


/* =====================================================
   GAME
===================================================== */

.game-screen{
  width:min(620px,100%);
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:14px;
}

.logo-small{
  font-family:"Cormorant Garamond",serif;
  font-size:25px;
  letter-spacing:4px;
  color:#e8d4aa;
}

.vip{
  border:1px solid rgba(205,164,82,.4);
  padding:7px 12px;
  font-size:9px;
  letter-spacing:2px;
  color:#d3ae63;
}

.balance-card{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:16px 18px;
  margin-bottom:14px;
}

.balance-label{
  font-size:9px;
  letter-spacing:3px;
  color:#887b69;
}

.balance{
  margin-top:5px;
  font-family:"Cormorant Garamond",serif;
  font-size:30px;
  color:#e8c979;
}

.reel-card{
  padding:18px;
}

.reels{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:7px;
}

.reel{
  aspect-ratio:1/1.22;
  min-width:0;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  border:1px solid rgba(204,163,80,.3);
  background:
    radial-gradient(circle at 50% 40%,rgba(145,104,42,.12),transparent 60%),
    #0c0907;
  transition:
    transform .12s ease,
    border-color .2s ease,
    box-shadow .2s ease;
}

.reel.spinning{
  border-color:rgba(224,189,112,.55);
  box-shadow:
    inset 0 0 18px rgba(224,189,112,.08),
    0 0 8px rgba(224,189,112,.04);
}

.symbol{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
}

.symbol:before{
  content:"";
  width:68%;
  height:68%;
  border:1px solid rgba(202,164,87,.22);
  transform:rotate(45deg);
  position:absolute;
}

.symbol-art{
  position:relative;
  z-index:2;
  font-family:"Cormorant Garamond",serif;
  font-weight:600;
  font-size:35px;
  line-height:1;
  color:#e7c77b;
  text-shadow:
    0 0 9px rgba(219,183,102,.35),
    0 2px 3px #000;
}

.symbol-diamond .symbol-art{
  font-size:32px;
}

.symbol-seven .symbol-art{
  font-size:42px;
  font-style:italic;
}

.symbol-heart .symbol-art{
  font-size:38px;
}

.symbol-k .symbol-art{
  font-size:43px;
  font-weight:700;
  letter-spacing:0;
}

.symbol-spade .symbol-art{
  font-size:38px;
}

.symbol-star .symbol-art{
  font-size:32px;
}


/* =====================================================
   CONTROLS
===================================================== */

.controls{
  margin-top:16px;
}

.bet-row{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:7px;
  margin-bottom:10px;
}

.bet-btn{
  border:1px solid rgba(205,164,82,.32);
  background:#100c09;
  color:#c7b28e;
  padding:11px 4px;
  font-size:10px;
  letter-spacing:1px;
  cursor:pointer;
}

.bet-btn.active{
  border-color:#d4ad5f;
  color:#ebd18e;
  background:rgba(181,139,61,.14);
}

.spin-btn{
  width:100%;
  height:58px;
  border:1px solid #d9b66a;
  background:linear-gradient(180deg,#dcb96d,#ae8035);
  color:#140e08;
  font-weight:600;
  letter-spacing:4px;
  cursor:pointer;
}

.spin-btn:disabled{
  opacity:.55;
}

.message{
  min-height:25px;
  text-align:center;
  margin-top:13px;
  color:#c9aa70;
  font-size:12px;
}


/* =====================================================
   TOP PLAYERS
===================================================== */

.leaderboard-card{
  margin-top:14px;
  padding:20px 18px;
}

.leaderboard-title{
  text-align:center;
  font-size:10px;
  letter-spacing:6px;
  color:#c9a65d;
  margin-bottom:16px;
}

.leaderboard-subtitle{
  text-align:center;
  color:#756a5b;
  font-size:9px;
  letter-spacing:2px;
  margin-top:-8px;
  margin-bottom:15px;
}

.players{
  display:flex;
  flex-direction:column;
  gap:6px;
}

.player-row{
  display:grid;
  grid-template-columns:42px 1fr auto;
  align-items:center;
  min-height:48px;
  padding:7px 10px;
  border:1px solid rgba(205,164,82,.17);
  background:rgba(12,9,7,.65);
}

.player-rank{
  font-family:"Cormorant Garamond",serif;
  font-size:18px;
  color:#c9a65d;
}

.player-info{
  min-width:0;
}

.player-name{
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
  color:#d9c49c;
  font-size:10px;
  letter-spacing:1px;
}

.player-label{
  margin-top:2px;
  color:#655b4e;
  font-size:7px;
  letter-spacing:2px;
}

.player-balance{
  font-family:"Cormorant Garamond",serif;
  font-size:16px;
  color:#e1c274;
}

.leaderboard-loading,
.leaderboard-empty{
  text-align:center;
  padding:14px 4px;
  color:#756a5b;
  font-size:10px;
  letter-spacing:1px;
}


/* =====================================================
   WIN
===================================================== */

.win-flash{
  animation:winFlash .55s ease;
}

@keyframes winFlash{
  0%{
    box-shadow:inset 0 0 0 rgba(224,189,112,0);
  }

  50%{
    box-shadow:inset 0 0 30px rgba(224,189,112,.28);
  }

  100%{
    box-shadow:inset 0 0 0 rgba(224,189,112,0);
  }
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:430px){

  .app{
    padding:10px;
  }

  .login-card{
    padding:40px 22px 27px;
  }

  .brand{
    font-size:49px;
  }

  .brand-sub{
    font-size:25px;
  }

  .symbol-art{
    font-size:28px;
  }

  .symbol-seven .symbol-art{
    font-size:34px;
  }

  .symbol-k .symbol-art{
    font-size:36px;
  }

  .player-row{
    grid-template-columns:35px 1fr auto;
  }

}
</style>
</head>


<body>

<div class="app">


  <!-- ===================================================
       LOGIN
  ==================================================== -->

  <main id="loginScreen" class="screen">

    <section class="card login-card">

      <div class="eyebrow">
        WELCOME TO
      </div>

      <div class="brand">
        KIMIA
      </div>

      <div class="brand-sub">
        PRIVÉ
      </div>

      <div class="ornament">
        <span class="diamond"></span>
      </div>

      <p class="description">
        An exclusive private gaming experience.
        Your Telegram identity connects directly
        to your PRIVÉ account.
      </p>

      <button id="loginBtn" class="primary-btn">
        ENTER PRIVÉ
      </button>

      <div id="loginStatus" class="status"></div>

    </section>

  </main>


  <!-- ===================================================
       GAME
  ==================================================== -->

  <main id="gameScreen" class="screen game-screen hidden">


    <div class="topbar">

      <div class="logo-small">
        KIMIA PRIVÉ
      </div>

      <div id="vipBadge" class="vip">
        PRIVÉ
      </div>

    </div>


    <!-- BALANCE -->

    <section class="card balance-card">

      <div>

        <div class="balance-label">
          PRIVATE BALANCE
        </div>

        <div id="balance" class="balance">
          0
        </div>

      </div>

      <div id="playerName" class="balance-label">
        MEMBER
      </div>

    </section>


    <!-- SLOT MACHINE -->

    <section class="card reel-card">

      <div
        class="reels"
        id="reels">
      </div>


      <div class="controls">

        <div class="bet-row">

          <button
            class="bet-btn active"
            data-bet="300">
            300
          </button>

          <button
            class="bet-btn"
            data-bet="600">
            600
          </button>

          <button
            class="bet-btn"
            data-bet="1500">
            1,500
          </button>

          <button
            class="bet-btn"
            data-bet="3000">
            3,000
          </button>

        </div>


        <button
          id="spinBtn"
          class="spin-btn">
          SPIN
        </button>


        <div
          id="gameMessage"
          class="message">
        </div>

      </div>

    </section>


    <!-- =================================================
         TOP PLAYERS — STAYS AT BOTTOM
    ================================================== -->

    <section class="card leaderboard-card">

      <div class="leaderboard-title">
        TOP PLAYERS
      </div>

      <div class="leaderboard-subtitle">
        PRIVÉ LEADERBOARD
      </div>

      <div
        id="players"
        class="players">

        <div class="leaderboard-loading">
          LOADING PLAYERS…
        </div>

      </div>

    </section>


  </main>

</div>


<script>
(function(){

  "use strict";


  /* =====================================================
     TELEGRAM
  ===================================================== */

  const tg =
    window.Telegram &&
    window.Telegram.WebApp
      ? window.Telegram.WebApp
      : null;


  if(tg){

    try{

      tg.ready();
      tg.expand();
      tg.enableClosingConfirmation();

    }catch(e){

      console.warn(
        "Telegram WebApp setup:",
        e
      );

    }

  }


  /* =====================================================
     DOM
  ===================================================== */

  const loginScreen =
    document.getElementById("loginScreen");

  const gameScreen =
    document.getElementById("gameScreen");

  const loginBtn =
    document.getElementById("loginBtn");

  const loginStatus =
    document.getElementById("loginStatus");

  const balanceEl =
    document.getElementById("balance");

  const playerNameEl =
    document.getElementById("playerName");

  const vipBadge =
    document.getElementById("vipBadge");

  const reelsEl =
    document.getElementById("reels");

  const spinBtn =
    document.getElementById("spinBtn");

  const gameMessage =
    document.getElementById("gameMessage");

  const playersEl =
    document.getElementById("players");


  let selectedBet = 300;
  let currentPlayer = null;
  let spinning = false;


  /* =====================================================
     SYMBOL SET
     
     IMPORTANT:
     These are the actual visual symbols.
     No emoji are used for the spinning animation.
  ===================================================== */

  const SYMBOLS = [
    "K",
    "7",
    "HEART",
    "SPADE",
    "STAR",
    "DIAMOND"
  ];


  /* =====================================================
     API
  ===================================================== */

  async function apiPost(endpoint,body){

    const response =
      await fetch(
        endpoint,
        {
          method:"POST",

          headers:{
            "Content-Type":"application/json",
            "Accept":"application/json"
          },

          body:JSON.stringify(body)
        }
      );


    const text =
      await response.text();


    let data = null;


    if(text){

      try{

        data = JSON.parse(text);

      }catch(error){

        throw new Error(
          "Server returned invalid JSON."
        );

      }

    }


    if(!response.ok){

      const serverError =
        data && data.error
          ? data.error
          : `Server returned HTTP ${response.status}.`;

      throw new Error(serverError);

    }


    if(!data){

      throw new Error(
        "Server returned an empty response."
      );

    }


    return data;

  }


  /* =====================================================
     LEADERBOARD
  ===================================================== */

  async function loadLeaderboard(){

    try{

      const response =
        await fetch(
          "/api/leaderboard",
          {
            method:"GET",
            cache:"no-store",
            headers:{
              "Accept":"application/json"
            }
          }
        );


      const text =
        await response.text();


      if(!response.ok){

        throw new Error(
          `Leaderboard HTTP ${response.status}`
        );

      }


      if(!text){

        throw new Error(
          "Empty leaderboard response."
        );

      }


      const data =
        JSON.parse(text);


      const players =
        Array.isArray(data.players)
          ? data.players
          : [];


      renderLeaderboard(players);


    }catch(error){

      console.error(
        "LEADERBOARD ERROR:",
        error
      );


      playersEl.innerHTML = `
        <div class="leaderboard-empty">
          LEADERBOARD UNAVAILABLE
        </div>
      `;

    }

  }


  function renderLeaderboard(players){

    playersEl.innerHTML = "";


    if(
      !Array.isArray(players) ||
      players.length === 0
    ){

      playersEl.innerHTML = `
        <div class="leaderboard-empty">
          NO PLAYERS YET
        </div>
      `;

      return;

    }


    players
      .slice(0,10)
      .forEach((player,index) => {

        const row =
          document.createElement("div");


        row.className =
          "player-row";


        const rank =
          Number(player.rank) ||
          index + 1;


        const username =
          player.username ||
          player.name ||
          "Anonymous Player";


        const balance =
          Number(player.balance);


        const formattedBalance =
          Number.isFinite(balance)
            ? balance.toLocaleString()
            : "0";


        row.innerHTML = `

          <div class="player-rank">
            #${rank}
          </div>

          <div class="player-info">

            <div class="player-name">
              ${escapeHtml(
                String(username)
              )}
            </div>

            <div class="player-label">
              PRIVÉ MEMBER
            </div>

          </div>

          <div class="player-balance">
            ${formattedBalance}
          </div>

        `;


        playersEl.appendChild(row);

      });

  }


  function escapeHtml(value){

    return value
      .replace(/&/g,"&amp;")
      .replace(/</g,"&lt;")
      .replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;")
      .replace(/'/g,"&#039;");

  }


  /* =====================================================
     TELEGRAM INIT DATA
  ===================================================== */

  function getInitData(){

    if(!tg){

      throw new Error(
        "Telegram WebApp is not available."
      );

    }


    const initData =
      tg.initData;


    if(!initData){

      throw new Error(
        "Telegram did not provide login data. Open the game from the Telegram bot."
      );

    }


    return initData;

  }


  /* =====================================================
     LOGIN
  ===================================================== */

  async function login(){

    if(loginBtn.disabled){
      return;
    }


    loginBtn.disabled = true;
    loginBtn.textContent = "CONNECTING…";
    loginStatus.textContent = "";


    try{

      const initData =
        getInitData();


      const data =
        await apiPost(
          "/api/me",
          {
            initData:initData
          }
        );


      if(
        !data ||
        typeof data !== "object"
      ){

        throw new Error(
          "The server returned an incomplete account response."
        );

      }


      if(
        data.id === undefined ||
        data.balance === undefined
      ){

        throw new Error(
          "The server returned an incomplete account response."
        );

      }


      currentPlayer = data;


      updatePlayer(data);


      loginScreen.classList.add("hidden");
      gameScreen.classList.remove("hidden");


      loginStatus.textContent = "";


      loadLeaderboard();


    }catch(error){

      console.error(
        "LOGIN ERROR:",
        error
      );


      loginStatus.textContent =
        error && error.message
          ? error.message
          : "Login failed.";


    }finally{

      loginBtn.disabled = false;
      loginBtn.textContent = "ENTER PRIVÉ";

    }

  }


  /* =====================================================
     PLAYER DISPLAY
  ===================================================== */

  function updatePlayer(player){

    const balance =
      Number(player.balance);


    balanceEl.textContent =
      Number.isFinite(balance)
        ? balance.toLocaleString()
        : "0";


    let name =
      player.username ||
      player.first_name ||
      "PRIVÉ MEMBER";


    if(
      typeof name === "string" &&
      name.startsWith("@")
    ){

      name =
        name.substring(1);

    }


    playerNameEl.textContent =
      String(name).toUpperCase();


    const vip =
      Number(player.vipLevel || 0);


    if(vip > 0){

      vipBadge.textContent =
        `VIP ${vip}`;

    }else{

      vipBadge.textContent =
        "PRIVÉ";

    }

  }


  /* =====================================================
     NORMALIZE SERVER SYMBOLS
  ===================================================== */

  function normalizeSymbol(raw){

    if(
      raw === null ||
      raw === undefined
    ){

      return "STAR";

    }


    let value =
      String(raw)
        .trim()
        .toLowerCase();


    value =
      value.replace(/\uFE0F/g,"");


    value =
      value.replace(/\u200D/g,"");


    if(
      value === "🌹" ||
      value === "rose" ||
      value === "k" ||
      value === "letter k"
    ){

      return "K";

    }


    if(
      value === "💎" ||
      value === "diamond" ||
      value === "◆" ||
      value === "◇"
    ){

      return "DIAMOND";

    }


    if(
      value === "7" ||
      value === "7️⃣" ||
      value === "seven"
    ){

      return "7";

    }


    if(
      value === "💗" ||
      value === "❤️" ||
      value === "♥" ||
      value === "heart"
    ){

      return "HEART";

    }


    if(
      value === "♠" ||
      value === "♠️" ||
      value === "spade"
    ){

      return "SPADE";

    }


    if(
      value === "✨" ||
      value === "✦" ||
      value === "star"
    ){

      return "STAR";

    }


    return "STAR";

  }


  /* =====================================================
     SYMBOL CLASS
  ===================================================== */

  function symbolClass(symbol){

    if(symbol === "DIAMOND"){
      return "symbol-diamond";
    }

    if(symbol === "7"){
      return "symbol-seven";
    }

    if(symbol === "HEART"){
      return "symbol-heart";
    }

    if(symbol === "K"){
      return "symbol-k";
    }

    if(symbol === "SPADE"){
      return "symbol-spade";
    }

    return "symbol-star";

  }


  /* =====================================================
     SYMBOL MARKUP
  ===================================================== */

  function symbolMarkup(rawSymbol){

    const symbol =
      normalizeSymbol(rawSymbol);


    let art = "✦";


    if(symbol === "DIAMOND"){
      art = "◆";
    }

    if(symbol === "7"){
      art = "7";
    }

    if(symbol === "HEART"){
      art = "♥";
    }

    if(symbol === "K"){
      art = "K";
    }

    if(symbol === "SPADE"){
      art = "♠";
    }

    if(symbol === "STAR"){
      art = "✦";
    }


    return `
      <div class="symbol ${symbolClass(symbol)}">
        <span class="symbol-art">${art}</span>
      </div>
    `;

  }


  /* =====================================================
     CREATE REELS
  ===================================================== */

  function createReels(){

    reelsEl.innerHTML = "";


    for(let i=0;i<15;i++){

      const reel =
        document.createElement("div");


      reel.className =
        "reel";


      reel.dataset.index =
        String(i);


      reel.innerHTML =
        symbolMarkup(
          "STAR"
        );


      reelsEl.appendChild(reel);

    }

  }


  /* =====================================================
     SET ONE REEL
  ===================================================== */

  function setReel(index,symbol,isSpinning){

    const reel =
      reelsEl.children[index];


    if(!reel){
      return;
    }


    reel.className =
      isSpinning
        ? "reel spinning"
        : "reel";


    reel.innerHTML =
      symbolMarkup(symbol);

  }


  /* =====================================================
     RENDER FINAL RESULT
  ===================================================== */

  function renderSymbols(symbols){

    if(
      !Array.isArray(symbols) ||
      symbols.length !== 15
    ){

      return;

    }


    for(
      let i=0;
      i<15;
      i++
    ){

      setReel(
        i,
        symbols[i],
        false
      );

    }

  }


  /* =====================================================
     INITIAL REELS
  ===================================================== */

  createReels();


  renderSymbols([

    "K",
    "7",
    "HEART",
    "STAR",
    "SPADE",

    "DIAMOND",
    "K",
    "HEART",
    "7",
    "SPADE",

    "STAR",
    "DIAMOND",
    "K",
    "HEART",
    "7"

  ]);


  /* =====================================================
     BET SELECTION
  ===================================================== */

  document
    .querySelectorAll(".bet-btn")
    .forEach(button => {

      button.addEventListener(
        "click",
        () => {

          if(spinning){
            return;
          }


          document
            .querySelectorAll(".bet-btn")
            .forEach(btn =>
              btn.classList.remove("active")
            );


          button.classList.add("active");


          selectedBet =
            Number(
              button.dataset.bet
            );


          gameMessage.textContent =
            `BET ${selectedBet.toLocaleString()}`;

        }
      );

    });


  /* =====================================================
     REAL SLOT ANIMATION
     
     Each reel gets its own timer.
     This prevents the entire board from being
     replaced simultaneously and appearing stuck.
  ===================================================== */

  function startSlotAnimation(){

    const timers = [];

    const startTime =
      Date.now();


    for(
      let i=0;
      i<15;
      i++
    ){

      const delay =
        i * 35;


      setTimeout(() => {

        const timer =
          setInterval(() => {

            const randomSymbol =
              SYMBOLS[
                Math.floor(
                  Math.random() *
                  SYMBOLS.length
                )
              ];


            setReel(
              i,
              randomSymbol,
              true
            );


          },65);


        timers.push(timer);

      },delay);

    }


    return new Promise(resolve => {

      setTimeout(() => {

        timers.forEach(timer => {
          clearInterval(timer);
        });


        resolve();

      },1150);

    });

  }


  /* =====================================================
     SPIN
  ===================================================== */

  async function spin(){

    if(spinning){
      return;
    }


    spinning = true;


    spinBtn.disabled = true;
    spinBtn.textContent = "SPINNING…";
    gameMessage.textContent = "";


    try{

      const initData =
        getInitData();


      /*
        Start the real server request immediately.
      */

      const apiPromise =
        apiPost(
          "/api/spin",
          {
            initData:initData,
            bet:selectedBet
          }
        );


      /*
        Run the visual reels while the server
        determines the actual result.
      */

      await Promise.all([

        startSlotAnimation(),

        apiPromise

      ]);


      /*
        IMPORTANT:
        Promise.all above does not give us the
        API response directly because we need to
        preserve the animation timing.

        Get the same response here.
      */

      const data =
        await apiPromise;


      if(
        !data ||
        !Array.isArray(data.symbols) ||
        data.symbols.length !== 15
      ){

        throw new Error(
          "The server returned an incomplete spin response."
        );

      }


      /*
        REAL RESULT.
        The server's symbols are rendered only now.
      */

      renderSymbols(
        data.symbols
      );


      /* UPDATE BALANCE */

      if(
        data.balance !== undefined
      ){

        currentPlayer = {

          ...currentPlayer,

          balance:data.balance,

          vipLevel:
            data.vipLevel !== undefined
              ? data.vipLevel
              : currentPlayer.vipLevel,

          username:
            data.username !== undefined
              ? data.username
              : currentPlayer.username

        };


        updatePlayer(
          currentPlayer
        );

      }


      /* RESULT MESSAGE */

      const win =
        Number(
          data.win || 0
        );


      if(win > 0){

        gameMessage.textContent =
          `WIN · ${win.toLocaleString()} PRIVÉ COINS`;


        reelsEl.classList.add(
          "win-flash"
        );


        setTimeout(() => {

          reelsEl.classList.remove(
            "win-flash"
          );

        },600);


      }else{

        gameMessage.textContent =
          "NO WIN · TRY AGAIN";

      }


      /*
        Refresh leaderboard after spin.
      */

      loadLeaderboard();


    }catch(error){

      console.error(
        "SPIN ERROR:",
        error
      );


      /*
        Never leave the machine showing
        diamonds if the request fails.
      */

      for(
        let i=0;
        i<15;
        i++
      ){

        setReel(
          i,
          "STAR",
          false
        );

      }


      gameMessage.textContent =
        error && error.message
          ? error.message
          : "Spin failed.";

    }finally{

      setTimeout(() => {

        spinning = false;

        spinBtn.disabled = false;

        spinBtn.textContent =
          "SPIN";

      },350);

    }

  }


  /* =====================================================
     BUTTONS
  ===================================================== */

  loginBtn.addEventListener(
    "click",
    login
  );


  spinBtn.addEventListener(
    "click",
    spin
  );


  /* =====================================================
     AUTO LOGIN
  ===================================================== */

  window.addEventListener(
    "load",
    () => {

      if(
        tg &&
        tg.initData
      ){

        setTimeout(
          login,
          150
        );

      }

    }
  );


})();
</script>

</body>
  </html>
