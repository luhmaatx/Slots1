<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090706">
<title>KIMIA PRIVÉ</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap');

:root{
  --gold:#e9c98d;
  --gold2:#a8783d;
  --rose:#e99ab2;
  --cream:#fff2dc;
  --bg:#080605;
  --panel:#120b08;
}

*{box-sizing:border-box}

html{
  background:#050403;
  scroll-behavior:smooth;
}

body{
  margin:0;
  color:var(--cream);
  background:#050403;
  font-family:Inter,Arial,sans-serif;
  -webkit-tap-highlight-color:transparent;
}

button{
  font:inherit;
  cursor:pointer;
  touch-action:manipulation;
  -webkit-user-select:none;
  user-select:none;
}

button:disabled{
  opacity:.45;
  cursor:wait;
}

.shell{
  width:min(480px,100%);
  min-height:100vh;
  margin:auto;
  padding-bottom:105px;
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(ellipse at 50% 13%,rgba(191,115,72,.23),transparent 32%),
    radial-gradient(ellipse at 0 42%,rgba(233,154,178,.09),transparent 35%),
    linear-gradient(180deg,#150d09,#080605 58%,#100906);
  box-shadow:0 0 70px #000;
}

.noise{
  position:absolute;
  inset:0;
  opacity:.035;
  pointer-events:none;
  background-image:radial-gradient(#fff 1px,transparent 1px);
  background-size:5px 5px;
}

.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:18px 20px 5px;
  position:relative;
  z-index:5;
}

.menu,.avatar{
  width:42px;
  height:42px;
  border-radius:50%;
  display:grid;
  place-items:center;
}

.menu{
  border:1px solid #765c39;
  color:var(--gold);
  background:#100b08;
  font-size:19px;
}

.avatar{
  border:1px solid var(--gold);
  color:#fff0d2;
  background:linear-gradient(145deg,#28160f,#c78b76);
  font:19px Georgia,serif;
}

.tiny{
  color:#92816c;
  font-size:8px;
  letter-spacing:.18em;
}

.brand{
  text-align:center;
  margin:8px 15px 13px;
  position:relative;
}

.crown{
  color:var(--gold);
  font-size:26px;
  text-shadow:0 0 22px #d49b51;
  animation:crownGlow 2.8s ease-in-out infinite;
}

@keyframes crownGlow{
  50%{
    text-shadow:0 0 30px #e9c98d;
    transform:translateY(-2px);
  }
}

.brand h1{
  margin:5px 0 0;
  font:500 49px/.85 'Cormorant Garamond',Georgia,serif;
  letter-spacing:.06em;
  background:linear-gradient(#fff4d7,#c28f4b);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

.prive{
  margin-top:5px;
  padding-left:.34em;
  font:500 27px/1 'Cormorant Garamond',Georgia,serif;
  letter-spacing:.34em;
  color:#f2d9bf;
}

.tag{
  margin-top:9px;
  color:#caa66c;
  font-size:8px;
  letter-spacing:.34em;
}

.balance{
  margin:15px 16px 0;
  padding:12px 13px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  border:1px solid #5d482e;
  border-radius:14px;
  background:linear-gradient(100deg,#20140d,#100a07);
  box-shadow:inset 0 1px rgba(255,255,255,.035);
}

.balance small{
  display:block;
  color:#9a8871;
  font-size:8px;
  letter-spacing:.14em;
}

.balance strong{
  display:inline-block;
  margin-top:3px;
  font:500 23px 'Cormorant Garamond',Georgia,serif;
  color:#fff0d2;
  transition:transform .2s;
}

.balance.flash strong{
  animation:balanceFlash .65s ease;
}

@keyframes balanceFlash{
  50%{
    color:#fff1a9;
    transform:scale(1.12);
    text-shadow:0 0 18px #e9c98d;
  }
}

.balance .vip{
  color:var(--gold);
  font-size:9px;
  letter-spacing:.1em;
}

#playerName{
  display:block;
  margin-top:5px;
  max-width:150px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.jackpot{
  margin:17px 20px 0;
  text-align:center;
}

.jackpot .label{
  font-size:8px;
  letter-spacing:.25em;
  color:#b39769;
}

.jackpot .number{
  margin-top:3px;
  font:500 31px 'Cormorant Garamond',Georgia,serif;
  color:var(--gold);
  text-shadow:0 0 20px rgba(233,201,141,.27);
  transition:transform .25s;
}

.jackpot.pulse .number{
  animation:jackpotPulse .5s ease;
}

@keyframes jackpotPulse{
  50%{
    transform:scale(1.08);
    text-shadow:0 0 32px rgba(233,201,141,.7);
  }
}

.jackpot .line{
  height:1px;
  margin-top:5px;
  background:linear-gradient(90deg,transparent,#82633c,transparent);
}

/* MACHINE */

.machine{
  position:relative;
  margin:13px 10px 0;
  padding:12px;
  border:1px solid #977546;
  border-radius:26px;
  background:linear-gradient(145deg,#392519,#140c08 40%,#29190f);
  box-shadow:
    0 24px 55px #000,
    inset 0 1px 1px rgba(255,238,197,.22),
    0 0 30px rgba(233,154,178,.07);
}

.machine:before{
  content:"K  P";
  position:absolute;
  inset:7px;
  padding:24px 0 0 20px;
  border:1px solid rgba(232,201,141,.18);
  border-radius:21px;
  color:rgba(232,201,141,.09);
  font:50px Georgia,serif;
  letter-spacing:48px;
  pointer-events:none;
}

.machine.spinning{
  box-shadow:
    0 24px 55px #000,
    inset 0 1px 1px rgba(255,238,197,.22),
    0 0 35px rgba(233,201,141,.13);
}

.machine-title{
  position:relative;
  z-index:1;
  text-align:center;
  margin:0 0 10px;
  color:#c9a66d;
  font-size:8px;
  letter-spacing:.24em;
}

.reelbox{
  position:relative;
  z-index:1;
  padding:8px;
  border:1px solid #715333;
  border-radius:17px;
  background:linear-gradient(145deg,#100906,#030202 55%,#160d08);
  box-shadow:inset 0 0 25px #000,0 2px 9px #000;
}

.reels{
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  grid-template-rows:repeat(3,minmax(0,1fr));
  gap:5px;
  position:relative;
}

.reel{
  min-width:0;
  height:clamp(64px,16.8vw,78px);
  display:grid;
  place-items:center;
  position:relative;
  overflow:hidden;
  border:1px solid #b18b55;
  border-radius:9px;
  color:#25170e;
  font-size:clamp(21px,6.3vw,32px);
  background:
    linear-gradient(120deg,rgba(255,255,255,.7),transparent 22%,transparent 72%,rgba(125,81,36,.22)),
    linear-gradient(155deg,#fff7e8,#d5ba8b 48%,#f5e5ca);
  box-shadow:
    inset 0 1px 2px #fff,
    inset 0 -5px 9px rgba(92,55,22,.25),
    0 3px 5px #000;
  text-shadow:0 1px 1px rgba(255,255,255,.4);
  transform:translateZ(0);
}

.reel:before{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background:linear-gradient(
    180deg,
    rgba(255,255,255,.32),
    transparent 28%,
    transparent 72%,
    rgba(80,43,17,.15)
  );
}

.reel:after{
  content:"";
  position:absolute;
  inset:-10% -70%;
  pointer-events:none;
  background:linear-gradient(
    105deg,
    transparent 42%,
    rgba(255,255,255,.68) 50%,
    transparent 58%
  );
  transform:translateX(-110%);
}

.reel.spinning{
  animation:
    reelShake .075s infinite alternate,
    reelBlur .15s linear infinite;
  filter:blur(1.2px) brightness(1.13);
}

.reel.spinning:after{
  animation:sheen .22s linear infinite;
}

@keyframes sheen{
  to{transform:translateX(110%)}
}

@keyframes reelShake{
  from{transform:translateY(-3px)}
  to{transform:translateY(3px)}
}

@keyframes reelBlur{
  50%{filter:blur(2px) brightness(1.18)}
}

.reel.stop{
  animation:reelStop .22s ease-out;
}

@keyframes reelStop{
  0%{transform:translateY(-8px) scaleY(.92)}
  65%{transform:translateY(3px) scaleY(1.03)}
  100%{transform:translateY(0) scaleY(1)}
}

.reel.win{
  z-index:2;
  border-color:#ffe5a6;
  box-shadow:
    inset 0 0 18px rgba(255,240,180,.8),
    0 0 13px rgba(255,208,110,.8);
  animation:winPulse .48s ease-in-out 4;
}

@keyframes winPulse{
  50%{
    transform:scale(1.08);
    filter:brightness(1.38);
  }
}

.reel.bigwin{
  animation:bigWin .55s ease-in-out 5;
}

    transform
