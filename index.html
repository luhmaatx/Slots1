<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090706">
<title>KIMIA PRIVÉ</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@400;500;600&display=swap');

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  min-height:100%;
  background:
    radial-gradient(circle at 50% 15%,rgba(184,145,62,.10),transparent 32%),
    linear-gradient(180deg,#100b08 0%,#070605 100%);
  color:#ead8b1;
  font-family:Montserrat,Arial,sans-serif;
}

body{
  min-height:100vh;
  overflow-x:hidden;
}

button{
  font:inherit;
}

.app{
  width:100%;
  max-width:560px;
  min-height:100vh;
  margin:auto;
  padding:
    max(18px,env(safe-area-inset-top))
    16px
    max(24px,env(safe-area-inset-bottom));
}

/* =========================================================
   TOP BAR
========================================================= */

.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  min-height:48px;
  margin-bottom:10px;
}

.brand-small{
  font-family:"Cormorant Garamond",serif;
  letter-spacing:4px;
  font-size:18px;
  color:#e6c983;
}

.vip-badge{
  border:1px solid rgba(210,171,91,.45);
  padding:6px 11px;
  border-radius:20px;
  font-size:10px;
  letter-spacing:2px;
  color:#dcb968;
  background:rgba(255,255,255,.025);
}

/* =========================================================
   PANELS
========================================================= */

.panel{
  border:1px solid rgba(205,163,76,.35);
  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.045),
      rgba(255,255,255,.012)
    );
  box-shadow:
    0 18px 60px rgba(0,0,0,.42),
    inset 0 1px 0 rgba(255,255,255,.035);
}

/* =========================================================
   LOGIN
========================================================= */

#loginScreen{
  min-height:calc(100vh - 50px);
  display:flex;
  align-items:center;
  justify-content:center;
}

.login-card{
  width:100%;
  max-width:500px;
  padding:48px 30px 42px;
  text-align:center;
  border-radius:4px;
}

.eyebrow{
  font-size:10px;
  letter-spacing:7px;
  color:#c7a961;
  margin-bottom:20px;
}

.logo{
  font-family:"Cormorant Garamond",serif;
  font-size:56px;
  line-height:.82;
  letter-spacing:6px;
  color:#f0dfb9;
}

.logo-sub{
  margin-top:24px;
  font-family:"Cormorant Garamond",serif;
  font-size:25px;
  letter-spacing:9px;
  color:#d7bb76;
}

.divider{
  width:105px;
  height:1px;
  margin:28px auto;
  background:linear-gradient(
    90deg,
    transparent,
    #a98643,
    transparent
  );
  position:relative;
}

.divider:after{
  content:"✦";
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  padding:0 8px;
  background:#110c09;
  color:#cba85c;
  font-size:13px;
}

.login-copy{
  max-width:350px;
  margin:0 auto 30px;
  color:#9d9180;
  font-size:13px;
  line-height:1.8;
}

.gold-button{
  width:100%;
  border:1px solid #cba75c;
  background:linear-gradient(
    180deg,
    #e1bd6c,
    #b88838
  );
  color:#170f08;
  padding:17px 20px;
  font-size:14px;
  font-weight:600;
  letter-spacing:3px;
  cursor:pointer;
  box-shadow:
    0 8px 30px rgba(185,137,49,.16),
    inset 0 1px rgba(255,255,255,.45);
}

.gold-button:active{
  transform:scale(.985);
}

.gold-button:disabled{
  opacity:.55;
}

.error{
  min-height:18px;
  margin-top:18px;
  color:#c98282;
  font-size:12px;
  line-height:1.5;
}

/* =========================================================
   GAME
========================================================= */

#gameScreen{
  display:none;
}

.header{
  text-align:center;
  padding:8px 0 18px;
}

.header-title{
  font-family:"Cormorant Garamond",serif;
  font-size:34px;
  letter-spacing:6px;
  color:#e8d5aa;
}

.header-sub{
  margin-top:5px;
  font-size:9px;
  letter-spacing:4px;
  color:#88775b;
}

/* =========================================================
   ACCOUNT
========================================================= */

.account{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-bottom:14px;
}

.account-box{
  padding:14px;
  text-align:center;
}

.account-label{
  font-size:8px;
  letter-spacing:3px;
  color:#806f54;
  margin-bottom:6px;
}

.account-value{
  font-family:"Cormorant Garamond",serif;
  font-size:24px;
  color:#e2c37e;
}

.username{
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

/* =========================================================
   SLOT MACHINE
========================================================= */

.machine{
  padding:12px;
  border-radius:5px;
  background:
    linear-gradient(145deg,#211710,#0c0907);
  border:1px solid rgba(210,170,88,.42);
  box-shadow:
    0 25px 70px rgba(0,0,0,.65),
    inset 0 1px rgba(255,255,255,.05);
}

.machine-top{
  text-align:center;
  padding:7px 0 12px;
  font-size:8px;
  letter-spacing:4px;
  color:#8d754a;
}

.reels{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:5px;
  padding:8px;
  border:1px solid rgba(193,151,70,.3);
  background:#080706;
}

.reel{
  display:flex;
  flex-direction:column;
  gap:5px;
}

.cell{
  position:relative;
  aspect-ratio:1 / 1;
  min-width:0;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  border:1px solid rgba(199,160,84,.19);
  background:
    radial-gradient(
      circle at 50% 38%,
      rgba(220,181,96,.09),
      transparent 65%
    ),
    #100c09;
}

.cell:after{
  content:"";
  position:absolute;
  inset:3px;
  border:1px solid rgba(255,255,255,.025);
  pointer-events:none;
}

.symbol{
  position:relative;
  z-index:2;
  width:70%;
  height:70%;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* =========================================================
   LUXURY SYMBOL ART
========================================================= */

.gem{
  width:44%;
  height:44%;
  transform:rotate(45deg);
  border:2px solid #e2c16e;
  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.5),
      rgba(207,166,76,.15) 40%,
      rgba(255,255,255,.06)
    );
  box-shadow:
    0 0 18px rgba(224,188,103,.24),
    inset 0 0 12px rgba(255,255,255,.12);
}

.gem:before,
.gem:after{
  content:"";
  position:absolute;
  background:#d8b765;
}

.gem:before{
  width:1px;
  height:100%;
  left:50%;
  top:0;
}

.gem:after{
  height:1px;
  width:100%;
  top:50%;
  left:0;
}

.seven{
  font-family:"Cormorant Garamond",serif;
  font-size:42px;
  font-weight:600;
  color:#e4c36f;
  text-shadow:
    0 0 12px rgba(224,190,107,.32);
}

.heart{
  position:relative;
  width:30px;
  height:27px;
  transform:rotate(-45deg);
  background:linear-gradient(145deg,#d9a96a,#9a6238);
  box-shadow:0 0 15px rgba(181,119,70,.25);
}

.heart:before,
.heart:after{
  content:"";
  position:absolute;
  width:30px;
  height:27px;
  border-radius:50%;
  background:inherit;
}

.heart:before{
  top:-15px;
  left:0;
}

.heart:after{
  top:0;
  left:15px;
}

.rose{
  width:32px;
  height:32px;
  border-radius:50%;
  border:2px solid #b77a4f;
  position:relative;
  box-shadow:0 0 15px rgba(174,103,64,.25);
}

.rose:before,
.rose:after{
  content:"";
  position:absolute;
  border:2px solid #d0a071;
  border-radius:50%;
}

.rose:before{
  width:15px;
  height:15px;
  left:6px;
  top:6px;
}

.rose:after{
  width:6px;
  height:6px;
  left:11px;
  top:11px;
}

.spade{
  position:relative;
  width:32px;
  height:32px;
  transform:rotate(45deg);
  background:#d1bd98;
  border-radius:60% 0 60% 0;
  box-shadow:0 0 14px rgba(218,197,155,.18);
}

.spade:after{
  content:"";
  position:absolute;
  width:9px;
  height:22px;
  background:#d1bd98;
  right:-6px;
  bottom:-10px;
  transform:rotate(-45deg);
}

.sparkle{
  position:relative;
  width:30px;
  height:30px;
}

.sparkle:before,
.sparkle:after{
  content:"";
  position:absolute;
  left:50%;
  top:50%;
  background:#e1c477;
  transform:translate(-50%,-50%);
}

.sparkle:before{
  width:4px;
  height:32px;
}

.sparkle:after{
  width:32px;
  height:4px;
}

.sparkle{
  filter:drop-shadow(0 0 8px rgba(225,196,119,.3));
}

/* =========================================================
   WIN
========================================================= */

.win-display{
  min-height:34px;
  padding:12px 0 5px;
  text-align:center;
  font-family:"Cormorant Garamond",serif;
  font-size:22px;
  letter-spacing:2px;
  color:#dfbf72;
}

.win-display.show{
  animation:winPulse .45s ease;
}

@keyframes winPulse{
  0%{transform:scale(.9);opacity:.2}
  100%{transform:scale(1);opacity:1}
}

/* =========================================================
   CONTROLS
========================================================= */

.bet-panel{
  margin-top:12px;
  padding:14px;
}

.bet-title{
  text-align:center;
  font-size:8px;
  letter-spacing:3px;
  color:#847154;
  margin-bottom:10px;
}

.bets{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:6px;
}

.bet{
  border:1px solid rgba(196,156,76,.25);
  background:#0f0b08;
  color:#a99776;
  padding:11px 3px;
  font-size:10px;
  cursor:pointer;
}

.bet.active{
  border-color:#cda95f;
  color:#e5c57c;
  background:rgba(205,169,95,.09);
}

.spin{
  width:100%;
  margin-top:12px;
  padding:18px;
  border:1px solid #cda95f;
  background:
    linear-gradient(180deg,#dcb96d,#aa7932);
  color:#160f09;
  font-weight:600;
  letter-spacing:4px;
  font-size:14px;
  cursor:pointer;
  box-shadow:
    0 10px 35px rgba(174,125,47,.18);
}

.spin:disabled{
  opacity:.45;
}

/* =========================================================
   FOOTER / LEADERBOARD
========================================================= */

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:12px;
}

.secondary{
  padding:13px;
  border:1px solid rgba(197,157,78,.25);
  background:#0e0a08;
  color:#a8936c;
  font-size:10px;
  letter-spacing:2px;
  cursor:pointer;
}

.leaderboard{
  display:none;
  margin-top:12px;
  padding:16px;
}

.leaderboard.open{
  display:block;
}

.lb-title{
  text-align:center;
  font-family:"Cormorant Garamond",serif;
  font-size:22px;
  letter-spacing:3px;
  color:#ddc181;
  margin-bottom:14px;
}

.lb-row{
  display:grid;
  grid-template-columns:35px 1fr auto;
  gap:8px;
  padding:10px 3px;
  border-bottom:1px solid rgba(255,255,255,.045);
  font-size:10px;
}

.lb-rank{
  color:#77664d;
}

.lb-name{
  color:#bca989;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.lb-balance{
  color:#d6b86f;
}

/* =========================================================
   SPIN ANIMATION
========================================================= */

.spinning .cell{
  animation:reelFlash .09s linear infinite alternate;
}

@keyframes reelFlash{
  from{
    filter:brightness(.7);
    transform:translateY(1px);
  }
  to{
    filter:brightness(1.35);
    transform:translateY(-1px);
  }
}

.win-cell{
  animation:winningCell .7s ease-in-out 3;
  border-color:#d8b567 !important;
}

@keyframes winningCell{
  50%{
    box-shadow:
      0 0 20px rgba(220,184,104,.45),
      inset 0 0 14px rgba(220,184,104,.12);
  }
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:380px){
  .app{
    padding-left:10px;
    padding-right:10px;
  }

  .login-card{
    padding:38px 20px 34px;
  }

  .logo{
    font-size:47px;
  }

  .logo-sub{
    font-size:21px;
  }

  .reels{
    gap:3px;
    padding:5px;
  }

  .cell{
    border-width:1px;
  }

  .seven{
    font-size:34px;
  }
}
</style>
</head>

<body>

<div class="app">

  <!-- =====================================================
       LOGIN SCREEN
  ====================================================== -->

  <section id="loginScreen">

    <div class="login-card panel">

      <div class="eyebrow">WELCOME TO</div>

      <div class="logo">KIMIA</div>

      <div class="logo-sub">PRIVÉ</div>

      <div class="divider"></div>

      <div class="login-copy">
        An exclusive private gaming experience.
        Your Telegram identity connects directly
        to your PRIVÉ account.
      </div>

      <button id="loginButton" class="gold-button">
        ENTER PRIVÉ
      </button>

      <div id="loginError" class="error"></div>

    </div>

  </section>


  <!-- =====================================================
       GAME SCREEN
  ====================================================== -->

  <section id="gameScreen">

    <header class="header">

      <div class="header-title">
        KIMIA PRIVÉ
      </div>

      <div class="header-sub">
        PRIVATE LUXURY PLAY
      </div>

    </header>


    <!-- ACCOUNT -->

    <div class="account">

      <div class="account-box panel">

        <div class="account-label">
          PRIVÉ BALANCE
        </div>

        <div id="balance" class="account-value">
          0
        </div>

      </div>

      <div class="account-box panel">

        <div class="account-label">
          MEMBER
        </div>

        <div id="username" class="account-value username">
          —
        </div>

      </div>

    </div>


    <!-- SLOT MACHINE -->

    <div class="machine">

      <div class="machine-top">
        KIMIA PRIVÉ · EST. 2026
      </div>

      <div id="reels" class="reels">

        <!-- 15 cells generated by JavaScript -->

      </div>

      <div id="winDisplay" class="win-display">
        &nbsp;
      </div>

    </div>


    <!-- BETS -->

    <div class="bet-panel panel">

      <div class="bet-title">
        SELECT YOUR STAKE
      </div>

      <div class="bets">

        <button class="bet active" data-bet="300">
          300
        </button>

        <button class="bet" data-bet="600">
          600
        </button>

        <button class="bet" data-bet="1500">
          1.5K
        </button>

        <button class="bet" data-bet="3000">
          3K
        </button>

      </div>

      <button id="spinButton" class="spin">
        SPIN PRIVÉ
      </button>

    </div>


    <!-- ACTIONS -->

    <div class="actions">

      <button id="leaderboardButton" class="secondary">
        LEADERBOARD
      </button>

      <button id="refreshButton" class="secondary">
        REFRESH ACCOUNT
      </button>

    </div>


    <!-- LEADERBOARD -->

    <div id="leaderboard" class="leaderboard panel">

      <div class="lb-title">
        PRIVÉ LEADERBOARD
      </div>

      <div id="leaderboardRows"></div>

    </div>

  </section>

</div>


<script>
/* =========================================================
   KIMIA PRIVÉ FRONTEND
========================================================= */

(() => {

  "use strict";


  /* =======================================================
     TELEGRAM
  ======================================================= */

  const tg =
    window.Telegram &&
    window.Telegram.WebApp
      ? window.Telegram.WebApp
      : null;


  if (tg) {
    try {
      tg.ready();
      tg.expand();
      tg.setHeaderColor("#090706");
      tg.setBackgroundColor("#090706");
    } catch (e) {
      console.warn("Telegram WebApp setup:", e);
    }
  }


  /* =======================================================
     DOM
  ======================================================= */

  const loginScreen =
    document.getElementById("loginScreen");

  const gameScreen =
    document.getElementById("gameScreen");

  const loginButton =
    document.getElementById("loginButton");

  const loginError =
    document.getElementById("loginError");

  const balanceElement =
    document.getElementById("balance");

  const usernameElement =
    document.getElementById("username");

  const reelsElement =
    document.getElementById("reels");

  const spinButton =
    document.getElementById("spinButton");

  const winDisplay =
    document.getElementById("winDisplay");

  const leaderboardButton =
    document.getElementById("leaderboardButton");

  const refreshButton =
    document.getElementById("refreshButton");

  const leaderboard =
    document.getElementById("leaderboard");

  const leaderboardRows =
    document.getElementById("leaderboardRows");


  /* =======================================================
     STATE
  ======================================================= */

  let currentPlayer = null;

  let selectedBet = 300;

  let spinning = false;


  /* =======================================================
     SYMBOLS
     
     IMPORTANT:
     The server still uses its existing emoji values.
     We NEVER display those emoji values directly.
     Instead they are converted into luxury CSS artwork.
  ======================================================= */

  const SYMBOL_MAP = {

    "💎": "gem",

    "7️⃣": "seven",

    "💗": "heart",

    "🌹": "rose",

    "♠️": "spade",

    "✨": "sparkle"

  };


  /* =======================================================
     CREATE SYMBOL ART
  ======================================================= */

  function createSymbol(symbol) {

    const wrapper =
      document.createElement("div");

    wrapper.className = "symbol";

    const type =
      SYMBOL_MAP[symbol] || "sparkle";

    const art =
      document.createElement("div");

    art.className = type;

    wrapper.appendChild(art);

    return wrapper;
  }


  /* =======================================================
     CREATE REELS
  ======================================================= */

  function buildReels(symbols) {

    reelsElement.innerHTML = "";

    for (let column = 0; column < 5; column++) {

      const reel =
        document.createElement("div");

      reel.className = "reel";

      for (let row = 0; row < 3; row++) {

        const index =
          row * 5 + column;

        const cell =
          document.createElement("div");

        cell.className = "cell";

        const symbol =
          symbols &&
          symbols[index]
            ? symbols[index]
            : "✨";

        cell.appendChild(
          createSymbol(symbol)
        );

        reel.appendChild(cell);
      }

      reelsElement.appendChild(reel);
    }
  }


  /* =======================================================
     INITIAL REELS
  ======================================================= */

  buildReels([
    "💎","7️⃣","💗","🌹","♠️",
    "✨","💎","💗","🌹","7️⃣",
    "♠️","💎","✨","💗","🌹"
  ]);


  /* =======================================================
     NUMBER FORMAT
  ======================================================= */

  function formatNumber(value) {

    const number =
      Number(value);

    if (!Number.isFinite(number)) {
      return "0";
    }

    return number.toLocaleString(
      "en-US"
    );
  }


  /* =======================================================
     DISPLAY PLAYER
  ======================================================= */

  function displayPlayer(player) {

    /*
      The server's /api/me response is:

      {
        id,
        username,
        balance,
        vipLevel
      }

      Accept both camelCase and a few harmless
      fallback forms so the frontend doesn't
      reject a valid account.
    */

    if (!player || typeof player !== "object") {
      throw new Error(
        "The server returned an invalid account."
      );
    }

    const id =
      player.id ??
      player.telegram_id ??
      player.telegramId;

    const balance =
      player.balance;

    const vipLevel =
      player.vipLevel ??
      player.vip_level ??
      0;

    const username =
      player.username ||
      player.first_name ||
      "PRIVÉ PLAYER";


    /*
      Only require the fields actually needed
      to operate the game.
    */

    if (
      id === undefined ||
      id === null ||
      balance === undefined ||
      balance === null
    ) {

      console.error(
        "Incomplete account response:",
        player
      );

      throw new Error(
        "Returned an incomplete account response."
      );
    }


    currentPlayer = {

      id: String(id),

      username: String(username),

      balance: Number(balance),

      vipLevel: Number(vipLevel)

    };


    if (
      !Number.isFinite(
        currentPlayer.balance
      )
    ) {

      throw new Error(
        "The account balance returned by the server is invalid."
      );

    }


    balanceElement.textContent =
      formatNumber(
        currentPlayer.balance
      );

    usernameElement.textContent =
      currentPlayer.username;


    loginScreen.style.display =
      "none";

    gameScreen.style.display =
      "block";

  }


  /* =======================================================
     API REQUEST
  ======================================================= */

  async function apiRequest(
    endpoint,
    options = {}
  ) {

    const requestOptions = {

      method:
        options.method || "GET",

      headers: {
        "Content-Type":
          "application/json",
        ...(options.headers || {})
      },

      body:
        options.body
          ? JSON.stringify(options.body)
          : undefined

    };


    const response =
      await fetch(
        endpoint,
        requestOptions
      );


    let data = null;

    const text =
      await response.text();


    if (text) {

      try {

        data =
          JSON.parse(text);

      } catch {

        console.error(
          "Non-JSON server response:",
          text
        );

      }

    }


    if (!response.ok) {

      const message =
        data &&
        data.error
          ? data.error
          : `Server returned HTTP ${response.status}.`;

      throw new Error(message);
    }


    if (!data) {

      throw new Error(
        "The server returned an empty response."
      );

    }


    return data;

  }


  /* =======================================================
     GET TELEGRAM INIT DATA
  ======================================================= */

  function getInitData() {

    /*
      Telegram Web Apps expose initData
      directly through Telegram.WebApp.
    */

    if (
      tg &&
      typeof tg.initData === "string" &&
      tg.initData.length > 0
    ) {

      return tg.initData;

    }


    /*
      If Telegram has not supplied initData,
      login cannot be authenticated safely.
    */

    return "";

  }


  /* =======================================================
     LOGIN
  ======================================================= */

  async function login() {

    if (spinning) {
      return;
    }

    loginButton.disabled = true;

    loginButton.textContent =
      "CONNECTING…";

    loginError.textContent =
      "";


    try {

      const initData =
        getInitData();


      if (!initData) {

        throw new Error(
          "Telegram login data was not provided. Open KIMIA PRIVÉ from the Telegram bot."
        );

      }


      /*
        EXACTLY matches:

        app.post("/api/me", authenticatedUser,...)

        and:

        req.body.initData
      */

      const data =
        await apiRequest(
          "/api/me",
          {
            method: "POST",

            body: {
              initData: initData
            }
          }
        );


      console.log(
        "KIMIA PRIVÉ account response:",
        data
      );


      /*
        Your server returns the account
        object directly.
      */

      displayPlayer(data);


    } catch (error) {

      console.error(
        "KIMIA PRIVÉ login error:",
        error
      );

      loginError.textContent =
        error.message ||
        "Unable to connect to your PRIVÉ account.";

      loginButton.disabled =
        false;

      loginButton.textContent =
        "ENTER PRIVÉ";

    }

  }


  /* =======================================================
     BET SELECTION
  ======================================================= */

  document
    .querySelectorAll(".bet")
    .forEach(button => {

      button.addEventListener(
        "click",
        () => {

          if (spinning) {
            return;
          }

          document
            .querySelectorAll(".bet")
            .forEach(
              b =>
                b.classList.remove(
                  "active"
                )
            );

          button.classList.add(
            "active"
          );

          selectedBet =
            Number(
              button.dataset.bet
            );

        }
      );

    });


  /* =======================================================
     SHOW SPINNING STATE
  ======================================================= */

  function setSpinningState(value) {

    spinning = value;

    spinButton.disabled =
      value;

    reelsElement.classList.toggle(
      "spinning",
      value
    );

  }


  /* =======================================================
     SPIN
  ======================================================= */

  async function spin() {

    if (
      spinning ||
      !currentPlayer
    ) {
      return;
    }


    if (
      currentPlayer.balance <
      selectedBet
    ) {

      winDisplay.textContent =
        "NOT ENOUGH PRIVÉ COINS";

      return;

    }


    setSpinningState(true);

    winDisplay.textContent =
      "SPINNING…";


    try {

      const initData =
        getInitData();


      if (!initData) {

        throw new Error(
          "Telegram login data is missing."
        );

      }


      /*
        Small visual delay so the spin
        feels like an actual machine.
      */

      await new Promise(
        resolve =>
          setTimeout(
            resolve,
            650
          )
      );


      const result =
        await apiRequest(
          "/api/spin",
          {
            method: "POST",

            body: {

              initData:
                initData,

              bet:
                selectedBet

            }

          }
        );


      console.log(
        "Spin result:",
        result
      );


      if (
        !Array.isArray(
          result.symbols
        ) ||
        result.symbols.length !== 15
      ) {

        throw new Error(
          "The server returned an invalid spin."
        );

      }


      buildReels(
        result.symbols
      );


      /*
        Update balance from the
        server-authoritative result.
      */

      if (
        result.balance !== undefined
      ) {

        currentPlayer.balance =
          Number(
            result.balance
          );

        balanceElement.textContent =
          formatNumber(
            currentPlayer.balance
          );

      }


      const win =
        Number(result.win || 0);


      if (win > 0) {

        winDisplay.textContent =
          `WIN +${formatNumber(win)}`;

        winDisplay.classList.remove(
          "show"
        );

        void winDisplay.offsetWidth;

        winDisplay.classList.add(
          "show"
        );

        highlightWinningLines(
          result.winningLines
        );

      } else {

        winDisplay.textContent =
          "NO WIN";

      }


    } catch (error) {

      console.error(
        "Spin error:",
        error
      );

      winDisplay.textContent =
        error.message ||
        "SPIN FAILED";

    } finally {

      setSpinningState(false);

    }

  }


  /* =======================================================
     WINNING LINE HIGHLIGHT
  ======================================================= */

  function highlightWinningLines(
    winningLines
  ) {

    if (
      !Array.isArray(
        winningLines
      )
    ) {
      return;
    }


    const indexes = [];


    const lines = [

      [0,3,6,9,12],

      [1,4,7,10,13],

      [2,5,8,11,14],

      [0,4,8,10,12],

      [2,4,6,10,14]

    ];


    winningLines.forEach(
      result => {

        const line =
          lines[
            Number(result.line) - 1
          ];

        if (!line) {
          return;
        }

        line.forEach(
          index => {

            if (
              !indexes.includes(index)
            ) {
              indexes.push(index);
            }

          }
        );

      }
    );


    const cells =
      reelsElement.querySelectorAll(
        ".cell"
      );


    indexes.forEach(
      index => {

        if (cells[index]) {

          cells[index].classList.add(
            "win-cell"
          );

          setTimeout(
            () => {

              cells[index]
                .classList.remove(
                  "win-cell"
                );

            },
            2400
          );

        }

      }
    );

  }


  /* =======================================================
     LEADERBOARD
  ======================================================= */

  async function loadLeaderboard() {

    leaderboardRows.innerHTML =
      `<div style="text-align:center;color:#806f54;padding:15px">
        Loading…
      </div>`;


    leaderboard.classList.add(
      "open"
    );


    try {

      const data =
        await apiRequest(
          "/api/leaderboard"
        );


      if (
        !data.players ||
        !Array.isArray(
          data.players
        )
      ) {

        throw new Error(
          "Invalid leaderboard response."
        );

      }


      if (
        data.players.length === 0
      ) {

        leaderboardRows.innerHTML =
          `<div style="text-align:center;color:#806f54;padding:15px">
            No PRIVÉ players yet.
          </div>`;

        return;

      }


      leaderboardRows.innerHTML =
        data.players
          .map(player => `

            <div class="lb-row">

              <div class="lb-rank">
                #${Number(player.rank) || "—"}
              </div>

              <div class="lb-name">
                ${escapeHtml(
                  player.username ||
                  "PRIVÉ Player"
                )}
              </div>

              <div class="lb-balance">
                ${formatNumber(
                  player.balance
                )}
              </div>

            </div>

          `)
          .join("");


    } catch (error) {

      console.error(
        "Leaderboard error:",
        error
      );

      leaderboardRows.innerHTML =
        `<div style="text-align:center;color:#b97878;padding:15px">
          ${escapeHtml(
            error.message ||
            "Unable to load leaderboard."
          )}
        </div>`;

    }

  }


  /* =======================================================
     HTML ESCAPE
  ======================================================= */

  function escapeHtml(value) {

    return String(value)
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");

  }


  /* =======================================================
     REFRESH ACCOUNT
  ======================================================= */

  async function refreshAccount() {

    if (
      spinning ||
      !currentPlayer
    ) {
      return;
    }


    refreshButton.disabled =
      true;

    refreshButton.textContent =
      "REFRESHING…";


    try {

      const initData =
        getInitData();


      const data =
        await apiRequest(
          "/api/me",
          {
            method:"POST",

            body:{
              initData:
                initData
            }

          }
        );


      displayPlayer(data);


    } catch (error) {

      console.error(
        "Refresh error:",
        error
      );

      winDisplay.textContent =
        error.message ||
        "REFRESH FAILED";

    } finally {

      refreshButton.disabled =
        false;

      refreshButton.textContent =
        "REFRESH ACCOUNT";

    }

  }


  /* =======================================================
     EVENTS
  ======================================================= */

  loginButton.addEventListener(
    "click",
    login
  );

  spinButton.addEventListener(
    "click",
    spin
  );

  leaderboardButton.addEventListener(
    "click",
    () => {

      if (
        leaderboard.classList.contains(
          "open"
        )
      ) {

        leaderboard.classList.remove(
          "open"
        );

      } else {

        loadLeaderboard();

      }

    }
  );

  refreshButton.addEventListener(
    "click",
    refreshAccount
  );


  /* =======================================================
     AUTO LOGIN
     
     When opened inside Telegram,
     attempt login automatically.
  ======================================================= */

  window.addEventListener(
    "load",
    () => {

      /*
        Give Telegram a moment to finish
        initializing the WebApp object.
      */

      setTimeout(
        () => {

          if (
            tg &&
            tg.initData
          ) {

            login();

          }

        },
        250
      );

    }
  );


})();
</script>
