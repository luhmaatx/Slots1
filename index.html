<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090706">
<title>KIMIA PRIVÉ</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@400;500;600&display=swap');

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 25%,rgba(145,104,42,.16),transparent 38%),
    linear-gradient(145deg,#080605,#120d09 48%,#070605);
  color:#ead9b5;
  font-family:Montserrat,Arial,sans-serif;
}

body{
  min-height:100dvh;
}

button{
  font:inherit;
}

.app{
  width:100%;
  height:100dvh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:18px;
}

.screen{
  width:min(500px,100%);
  max-height:96dvh;
  overflow:auto;
  scrollbar-width:none;
}

.screen::-webkit-scrollbar{
  display:none;
}

.card{
  position:relative;
  border:1px solid rgba(205,164,82,.48);
  background:
    linear-gradient(145deg,rgba(31,22,16,.97),rgba(10,8,6,.98));
  box-shadow:
    0 0 0 1px rgba(255,255,255,.025) inset,
    0 25px 70px rgba(0,0,0,.6),
    0 0 45px rgba(158,113,42,.08);
}

.card:before{
  content:"";
  position:absolute;
  inset:8px;
  border:1px solid rgba(206,165,83,.10);
  pointer-events:none;
}

.login-card{
  padding:48px 30px 32px;
  text-align:center;
}

.eyebrow{
  font-size:10px;
  letter-spacing:8px;
  color:#c9a65d;
  margin-bottom:14px;
}

.brand{
  font-family:"Cormorant Garamond",serif;
  font-size:58px;
  line-height:.9;
  letter-spacing:7px;
  color:#f0e1c3;
  margin-left:7px;
}

.brand-sub{
  margin-top:15px;
  font-family:"Cormorant Garamond",serif;
  font-size:28px;
  letter-spacing:11px;
  color:#d5b56d;
  margin-left:11px;
}

.ornament{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:16px;
  margin:30px 0 28px;
  color:#cba45b;
}

.ornament:before,
.ornament:after{
  content:"";
  width:35px;
  height:1px;
  background:linear-gradient(90deg,transparent,#b9934e);
}

.ornament:after{
  background:linear-gradient(90deg,#b9934e,transparent);
}

.diamond{
  transform:rotate(45deg);
  width:9px;
  height:9px;
  background:#c9a45a;
  box-shadow:0 0 14px rgba(215,175,91,.45);
}

.description{
  max-width:360px;
  margin:0 auto 31px;
  color:#a99b87;
  font-size:13px;
  line-height:1.8;
}

.primary-btn{
  position:relative;
  width:100%;
  min-height:58px;
  border:1px solid #e0bc6c;
  background:linear-gradient(180deg,#e0bd70,#b9893b);
  color:#160f09;
  font-weight:600;
  letter-spacing:3px;
  cursor:pointer;
  box-shadow:
    0 8px 24px rgba(0,0,0,.35),
    inset 0 1px rgba(255,255,255,.3);
}

.primary-btn:active{
  transform:translateY(1px);
}

.primary-btn:disabled{
  opacity:.55;
  cursor:wait;
}

.status{
  min-height:20px;
  margin-top:20px;
  font-size:12px;
  line-height:1.6;
  color:#b88e8e;
}

.debug{
  display:none;
  margin-top:12px;
  padding:10px;
  border:1px solid rgba(205,164,82,.18);
  background:rgba(0,0,0,.25);
  color:#8e8272;
  font-size:9px;
  line-height:1.5;
  text-align:left;
  word-break:break-word;
}

.hidden{
  display:none!important;
}

/* GAME */

.game-screen{
  width:min(620px,100%);
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:14px;
}

.logo-small{
  font-family:"Cormorant Garamond",serif;
  font-size:25px;
  letter-spacing:4px;
  color:#e8d4aa;
}

.vip{
  border:1px solid rgba(205,164,82,.4);
  padding:7px 12px;
  font-size:9px;
  letter-spacing:2px;
  color:#d3ae63;
}

.balance-card{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:16px 18px;
  margin-bottom:14px;
}

.balance-label{
  font-size:9px;
  letter-spacing:3px;
  color:#887b69;
}

.balance{
  margin-top:5px;
  font-family:"Cormorant Garamond",serif;
  font-size:30px;
  color:#e8c979;
}

.reel-card{
  padding:18px;
}

.reels{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:7px;
}

.reel{
  aspect-ratio:1/1.22;
  min-width:0;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  border:1px solid rgba(204,163,80,.3);
  background:
    radial-gradient(circle at 50% 40%,rgba(145,104,42,.12),transparent 60%),
    #0c0907;
}

.symbol{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
}

.symbol:before{
  content:"";
  width:68%;
  height:68%;
  border:1px solid rgba(202,164,87,.22);
  transform:rotate(45deg);
  position:absolute;
}

.symbol-art{
  position:relative;
  z-index:2;
  font-family:"Cormorant Garamond",serif;
  font-weight:600;
  font-size:35px;
  line-height:1;
  color:#e7c77b;
  text-shadow:
    0 0 9px rgba(219,183,102,.35),
    0 2px 3px #000;
}

.symbol-diamond .symbol-art{font-size:32px}
.symbol-seven .symbol-art{font-size:42px;font-style:italic}
.symbol-heart .symbol-art{font-size:36px}
.symbol-rose .symbol-art{font-size:32px}
.symbol-spade .symbol-art{font-size:38px}
.symbol-star .symbol-art{font-size:32px}

.controls{
  margin-top:16px;
}

.bet-row{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:7px;
  margin-bottom:10px;
}

.bet-btn{
  border:1px solid rgba(205,164,82,.32);
  background:#100c09;
  color:#c7b28e;
  padding:11px 4px;
  font-size:10px;
  letter-spacing:1px;
}

.bet-btn.active{
  border-color:#d4ad5f;
  color:#ebd18e;
  background:rgba(181,139,61,.14);
}

.spin-btn{
  width:100%;
  height:58px;
  border:1px solid #d9b66a;
  background:linear-gradient(180deg,#dcb96d,#ae8035);
  color:#140e08;
  font-weight:600;
  letter-spacing:4px;
}

.spin-btn:disabled{
  opacity:.55;
}

.message{
  min-height:25px;
  text-align:center;
  margin-top:13px;
  color:#c9aa70;
  font-size:12px;
}

@media(max-width:430px){
  .login-card{
    padding:40px 22px 27px;
  }

  .brand{
    font-size:49px;
  }

  .brand-sub{
    font-size:25px;
  }

  .symbol-art{
    font-size:28px;
  }

  .symbol-seven .symbol-art{
    font-size:34px;
  }
}
</style>
</head>

<body>

<div class="app">

<main id="loginScreen" class="screen">

<section class="card login-card">

<div class="eyebrow">WELCOME TO</div>

<div class="brand">KIMIA</div>
<div class="brand-sub">PRIVÉ</div>

<div class="ornament">
<span class="diamond"></span>
</div>

<p class="description">
An exclusive private gaming experience.
Your Telegram identity connects directly
to your PRIVÉ account.
</p>

<button id="loginBtn" class="primary-btn">
ENTER PRIVÉ
</button>

<div id="loginStatus" class="status"></div>

<div id="debugBox" class="debug"></div>

</section>

</main>


<main id="gameScreen" class="screen game-screen hidden">

<div class="topbar">
<div class="logo-small">KIMIA PRIVÉ</div>
<div id="vipBadge" class="vip">PRIVÉ</div>
</div>

<section class="card balance-card">

<div>
<div class="balance-label">PRIVATE BALANCE</div>
<div id="balance" class="balance">0</div>
</div>

<div id="playerName" class="balance-label">
MEMBER
</div>

</section>

<section class="card reel-card">

<div id="reels" class="reels"></div>

<div class="controls">

<div class="bet-row">

<button class="bet-btn active" data-bet="300">300</button>
<button class="bet-btn" data-bet="600">600</button>
<button class="bet-btn" data-bet="1500">1,500</button>
<button class="bet-btn" data-bet="3000">3,000</button>

</div>

<button id="spinBtn" class="spin-btn">
SPIN
</button>

<div id="gameMessage" class="message"></div>

</div>

</section>

</main>

</div>


<script>
(function(){

"use strict";

/* =====================================================
   TELEGRAM
===================================================== */

const tg =
  window.Telegram &&
  window.Telegram.WebApp
    ? window.Telegram.WebApp
    : null;


/* =====================================================
   API BASE
===================================================== */

/*
  The game is hosted by the same Render service,
  so relative API paths are preferred.

  The absolute Render URL is retained as a fallback
  if Telegram's WebView has a problem resolving the
  relative request.
*/

const API_URL =
  "https://kimia-prive-api.onrender.com";


/* =====================================================
   TELEGRAM SETUP
===================================================== */

if(tg){

  try{

    tg.ready();
    tg.expand();

    if(typeof tg.enableClosingConfirmation === "function"){
      tg.enableClosingConfirmation();
    }

  }catch(error){

    console.warn(
      "Telegram setup:",
      error
    );

  }

}


/* =====================================================
   DOM
===================================================== */

const loginScreen =
  document.getElementById("loginScreen");

const gameScreen =
  document.getElementById("gameScreen");

const loginBtn =
  document.getElementById("loginBtn");

const loginStatus =
  document.getElementById("loginStatus");

const debugBox =
  document.getElementById("debugBox");

const balanceEl =
  document.getElementById("balance");

const playerNameEl =
  document.getElementById("playerName");

const vipBadge =
  document.getElementById("vipBadge");

const reelsEl =
  document.getElementById("reels");

const spinBtn =
  document.getElementById("spinBtn");

const gameMessage =
  document.getElementById("gameMessage");


let selectedBet = 300;
let currentPlayer = null;
let spinning = false;


/* =====================================================
   DEBUG
===================================================== */

function showDebug(text){

  if(!debugBox){
    return;
  }

  debugBox.style.display = "block";
  debugBox.textContent = text;

}


/* =====================================================
   API POST
===================================================== */

async function apiPost(endpoint, body){

  const urls = [
    endpoint,
    API_URL + endpoint
  ];

  let lastError = null;

  for(const url of urls){

    try{

      const response =
        await fetch(
          url,
          {
            method:"POST",
            headers:{
              "Content-Type":"application/json",
              "Accept":"application/json"
            },
            body:JSON.stringify(body),
            cache:"no-store"
          }
        );

      const text =
        await response.text();

      console.log(
        "API RESPONSE",
        url,
        response.status,
        text
      );

      if(!text){

        lastError =
          new Error(
            `Empty server response · HTTP ${response.status}`
          );

        continue;
      }


      let data;

      try{

        data =
          JSON.parse(text);

      }catch(error){

        lastError =
          new Error(
            `Invalid JSON · HTTP ${response.status} · ${text.substring(0,200)}`
          );

        continue;
      }


      if(!response.ok){

        throw new Error(
          data && data.error
            ? data.error
            : `Server returned HTTP ${response.status}.`
        );

      }


      return data;

    }catch(error){

      lastError = error;

      console.error(
        "API REQUEST FAILED:",
        url,
        error
      );

      /*
        If the first request failed before receiving
        a response, try the absolute Render URL.
      */

      continue;

    }

  }


  throw lastError ||
    new Error(
      "Unable to contact the KIMIA PRIVÉ server."
    );

}


/* =====================================================
   INIT DATA
===================================================== */

function getInitData(){

  if(!tg){

    throw new Error(
      "Telegram WebApp is not available."
    );

  }


  const initData =
    tg.initData;


  if(
    !initData ||
    typeof initData !== "string"
  ){

    throw new Error(
      "Telegram did not provide login data. Close the game and reopen it from the KIMIA PRIVÉ Telegram bot."
    );

  }


  return initData;

}


/* =====================================================
   LOGIN
===================================================== */

async function login(){

  if(loginBtn.disabled){
    return;
  }

  loginBtn.disabled = true;
  loginBtn.textContent = "CONNECTING…";

  loginStatus.textContent = "";
  debugBox.style.display = "none";


  try{

    const initData =
      getInitData();


    console.log(
      "Telegram initData received:",
      initData.length,
      "characters"
    );


    const data =
      await apiPost(
        "/api/me",
        {
          initData:initData
        }
      );


    if(
      !data ||
      typeof data !== "object"
    ){

      throw new Error(
        "The server returned an incomplete account response."
      );

    }


    if(
      data.id === undefined ||
      data.balance === undefined
    ){

      throw new Error(
        "The server returned an incomplete account response."
      );

    }


    currentPlayer =
      data;


    updatePlayer(data);


    loginScreen.classList.add(
      "hidden"
    );

    gameScreen.classList.remove(
      "hidden"
    );

    loginStatus.textContent = "";


  }catch(error){

    console.error(
      "LOGIN ERROR:",
      error
    );


    const message =
      error &&
      error.message
        ? error.message
        : "Login failed.";


    loginStatus.textContent =
      message;


    showDebug(
      "LOGIN DEBUG\n" +
      "Page: " +
      window.location.href +
      "\n\n" +
      "API: " +
      API_URL +
      "/api/me\n\n" +
      message
    );


  }finally{

    loginBtn.disabled = false;
    loginBtn.textContent = "ENTER PRIVÉ";

  }

}


/* =====================================================
   PLAYER DISPLAY
===================================================== */

function updatePlayer(player){

  const balance =
    Number(player.balance);


  balanceEl.textContent =
    Number.isFinite(balance)
      ? balance.toLocaleString()
      : "0";


  let name =
    player.username ||
    "PRIVÉ MEMBER";


  if(
    typeof name === "string" &&
    name.startsWith("@")
  ){

    name =
      name.substring(1);

  }


  playerNameEl.textContent =
    String(name).toUpperCase();


  const vip =
    Number(
      player.vipLevel || 0
    );


  vipBadge.textContent =
    vip > 0
      ? `VIP ${vip}`
      : "PRIVÉ";

}


/* =====================================================
   LUXURY SYMBOL ART
===================================================== */

function symbolClass(symbol){

  if(symbol === "💎")
    return "symbol-diamond";

  if(symbol === "7️⃣")
    return "symbol-seven";

  if(symbol === "💗")
    return "symbol-heart";

  if(symbol === "🌹")
    return "symbol-rose";

  if(symbol === "♠️")
    return "symbol-spade";

  if(symbol === "✨")
    return "symbol-star";

  return "symbol-star";

}


function symbolMarkup(symbol){

  let art = "✦";


  if(symbol === "💎")
    art = "◆";


  if(symbol === "7️⃣")
    art = "7";


  if(symbol === "💗")
    art = "♥";


  if(symbol === "🌹")
    art = "✿";


  if(symbol === "♠️")
    art = "♠";


  if(symbol === "✨")
    art = "✦";


  return `
    <div class="symbol ${symbolClass(symbol)}">
      <span class="symbol-art">${art}</span>
    </div>
  `;

}


/* =====================================================
   REELS
===================================================== */

function renderSymbols(symbols){

  reelsEl.innerHTML = "";


  if(
    !Array.isArray(symbols) ||
    symbols.length !== 15
  ){

    for(
      let i = 0;
      i < 15;
      i++
    ){

      const reel =
        document.createElement("div");

      reel.className =
        "reel";

      reel.innerHTML =
        symbolMarkup("✨");

      reelsEl.appendChild(reel);

    }

    return;

  }


  symbols.forEach(
    symbol => {

      const reel =
        document.createElement("div");

      reel.className =
        "reel";

      reel.innerHTML =
        symbolMarkup(symbol);

      reelsEl.appendChild(reel);

    }
  );

}


/* =====================================================
   INITIAL REELS
===================================================== */

renderSymbols([
  "💎",
  "7️⃣",
  "💗",
  "🌹",
  "♠️",
  "✨",
  "💎",
  "💗",
  "🌹",
  "♠️",
  "7️⃣",
  "💗",
  "✨",
  "💎",
  "🌹"
]);


/* =====================================================
   BET BUTTONS
===================================================== */

document
  .querySelectorAll(".bet-btn")
  .forEach(button => {

    button.addEventListener(
      "click",
      () => {

        if(spinning){
          return;
        }


        document
          .querySelectorAll(".bet-btn")
          .forEach(
            btn =>
              btn.classList.remove(
                "active"
              )
          );


        button.classList.add(
          "active"
        );


        selectedBet =
          Number(
            button.dataset.bet
          );


        gameMessage.textContent =
          `BET ${selectedBet.toLocaleString()}`;

      }
    );

  });


/* =====================================================
   SPIN
===================================================== */

async function spin(){

  if(spinning){
    return;
  }


  spinning = true;

  spinBtn.disabled = true;
  spinBtn.textContent = "SPINNING…";
  gameMessage.textContent = "";


  let animation = null;


  try{

    const initData =
      getInitData();


    let animationCount = 0;


    animation =
      setInterval(
        () => {

          const choices = [
            "💎",
            "7️⃣",
            "💗",
            "🌹",
            "♠️",
            "✨"
          ];


          const fakeSymbols =
            Array.from(
              {length:15},
              () =>
                choices[
                  Math.floor(
                    Math.random() *
                    choices.length
                  )
                ]
            );


          renderSymbols(
            fakeSymbols
          );


          animationCount++;


          if(
            animationCount >= 8
          ){

            clearInterval(
              animation
            );

          }

        },
        90
      );


    const data =
      await apiPost(
        "/api/spin",
        {
          initData:initData,
          bet:selectedBet
        }
      );


    if(
      !data ||
      !Array.isArray(
        data.symbols
      )
    ){

      throw new Error(
        "The server returned an incomplete spin response."
      );

    }


    if(animation){
      clearInterval(animation);
    }


    renderSymbols(
      data.symbols
    );


    if(
      data.balance !== undefined
    ){

      currentPlayer = {
        ...currentPlayer,
        balance:data.balance,
        vipLevel:data.vipLevel,
        username:data.username
      };


      updatePlayer(
        currentPlayer
      );

    }


    const win =
      Number(
        data.win || 0
      );


    if(win > 0){

      gameMessage.textContent =
        `WIN · ${win.toLocaleString()} PRIVÉ COINS`;

    }else{

      gameMessage.textContent =
        "NO WIN · TRY AGAIN";

    }


  }catch(error){

    if(animation){
      clearInterval(animation);
    }


    console.error(
      "SPIN ERROR:",
      error
    );


    gameMessage.textContent =
      error &&
      error.message
        ? error.message
        : "Spin failed.";

  }finally{

    setTimeout(
      () => {

        spinning = false;

        spinBtn.disabled = false;

        spinBtn.textContent =
          "SPIN";

      },
      350
    );

  }

}


/* =====================================================
   BUTTONS
===================================================== */

loginBtn.addEventListener(
  "click",
  login
);


spinBtn.addEventListener(
  "click",
  spin
);


/* =====================================================
   AUTO LOGIN
===================================================== */

window.addEventListener(
  "load",
  () => {

    if(
      tg &&
      tg.initData
    ){

      setTimeout(
        login,
        300
      );

    }

  }
);

})();
</script>

</body>
  </html>
