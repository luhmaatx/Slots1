
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090706">
<title>KIMIA PRIVÉ</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@400;500;600&display=swap');

:root {
  --gold:#d7b66e;
  --gold-light:#f0dfb9;
  --gold-dark:#99702f;
  --muted:#a99b87;
  --panel:#100c09;
  --red:#bc8f8f;
}

* {
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body {
  margin:0;
  width:100%;
  min-height:100%;
  background:
    radial-gradient(ellipse at 50% 15%,rgba(145,104,42,.16),transparent 48%),
    linear-gradient(145deg,#080605,#120d09 48%,#070605);
  color:#ead9b5;
  font-family:Montserrat,Arial,sans-serif;
}

body { min-height:100dvh; }
button { font:inherit; cursor:pointer; }
button:disabled { opacity:.55; cursor:wait; }

.app {
  min-height:100dvh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:18px;
}

.screen {
  width:min(500px,100%);
  max-height:96dvh;
  overflow:auto;
  scrollbar-width:none;
}
.screen::-webkit-scrollbar { display:none; }
.hidden { display:none!important; }

.card {
  position:relative;
  border:1px solid rgba(205,164,82,.48);
  background:linear-gradient(145deg,rgba(31,22,16,.97),rgba(10,8,6,.99));
  box-shadow:0 0 0 1px rgba(255,255,255,.025) inset,
             0 25px 70px rgba(0,0,0,.6),
             0 0 45px rgba(158,113,42,.08);
}

.card:before {
  content:"";
  position:absolute;
  inset:8px;
  border:1px solid rgba(206,165,83,.10);
  pointer-events:none;
}

.login-card {
  padding:45px 28px 30px;
  text-align:center;
}

.eyebrow {
  font-size:10px;
  letter-spacing:7px;
  color:#c9a65d;
  margin-bottom:15px;
}

.brand {
  font-family:"Cormorant Garamond",serif;
  font-size:clamp(46px,13vw,60px);
  line-height:.95;
  letter-spacing:7px;
  color:#f0e1c3;
  margin-left:7px;
}

.brand-sub {
  margin:14px 0 0 10px;
  font-family:"Cormorant Garamond",serif;
  font-size:27px;
  letter-spacing:10px;
  color:#d5b56d;
}

.ornament {
  display:flex;
  justify-content:center;
  align-items:center;
  gap:16px;
  margin:29px 0 26px;
}
.ornament:before,.ornament:after {
  content:"";
  width:40px;
  height:1px;
  background:linear-gradient(90deg,transparent,#b9934e);
}
.ornament:after {
  background:linear-gradient(90deg,#b9934e,transparent);
}
.diamond {
  width:9px;
  height:9px;
  transform:rotate(45deg);
  background:#c9a45a;
  box-shadow:0 0 14px rgba(215,175,91,.45);
}

.description {
  max-width:360px;
  margin:0 auto 28px;
  color:var(--muted);
  font-size:12px;
  line-height:1.9;
}

.primary-btn,.spin-btn {
  width:100%;
  min-height:56px;
  border:1px solid #e0bc6c;
  background:linear-gradient(180deg,#e0bd70,#b9893b);
  color:#160f09;
  font-weight:600;
  letter-spacing:3px;
  box-shadow:0 8px 24px rgba(0,0,0,.35),inset 0 1px rgba(255,255,255,.3);
}
.primary-btn:active,.spin-btn:active { transform:translateY(1px); }

.status {
  min-height:20px;
  margin-top:18px;
  font-size:11px;
  line-height:1.8;
  color:var(--red);
  overflow-wrap:anywhere;
}
.status.ok { color:#c9aa70; }

.game-screen { width:min(620px,100%); }

.topbar {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:14px;
}
.logo-small {
  font-family:"Cormorant Garamond",serif;
  font-size:clamp(19px,5vw,25px);
  letter-spacing:3px;
  color:#e8d4aa;
}
.vip {
  border:1px solid rgba(205,164,82,.4);
  padding:7px 10px;
  font-size:9px;
  letter-spacing:2px;
  color:#d3ae63;
}

.balance-card {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  padding:15px 18px;
  margin-bottom:14px;
}
.balance-label {
  font-size:9px;
  letter-spacing:2px;
  color:#a89982;
}
.balance {
  margin-top:5px;
  font-family:"Cormorant Garamond",serif;
  font-size:30px;
  color:#e8c979;
}
#playerName {
  max-width:45%;
  overflow-wrap:anywhere;
  text-align:right;
}

.reel-card { padding:16px; }

.reels {
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:6px;
}
.reel {
  aspect-ratio:1/1.22;
  min-width:0;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  border:1px solid rgba(204,163,80,.3);
  background:radial-gradient(circle at 50% 40%,rgba(145,104,42,.12),transparent 60%),#0c0907;
}
.symbol {
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
}
.symbol:before {
  content:"";
  width:65%;
  height:65%;
  border:1px solid rgba(202,164,87,.22);
  transform:rotate(45deg);
  position:absolute;
}
.symbol-art {
  position:relative;
  z-index:2;
  font-family:"Cormorant Garamond",serif;
  font-weight:600;
  font-size:clamp(22px,6vw,36px);
  line-height:1;
  color:#e7c77b;
  text-shadow:0 0 9px rgba(219,183,102,.35),0 2px 3px #000;
}
.symbol-diamond .symbol-art { font-size:clamp(21px,5.5vw,32px); }
.symbol-seven .symbol-art { font-size:clamp(30px,7vw,43px); font-style:italic; }
.symbol-heart .symbol-art { color:#c68d8b; }
.symbol-rose .symbol-art { color:#d6b276; }
.symbol-spade .symbol-art { font-size:clamp(26px,6vw,38px); }
.symbol-star .symbol-art { color:#ead7a4; }

.controls { margin-top:16px; }
.bet-row {
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:7px;
  margin-bottom:10px;
}
.bet-btn {
  min-height:40px;
  border:1px solid rgba(205,164,82,.32);
  background:#100c09;
  color:#c7b28e;
  padding:8px 3px;
  font-size:clamp(9px,2.6vw,11px);
  letter-spacing:.5px;
}
.bet-btn.active {
  border-color:#d4ad5f;
  color:#ebd18e;
  background:rgba(181,139,61,.14);
}
.message {
  min-height:26px;
  text-align:center;
  margin-top:13px;
  color:#c9aa70;
  font-size:11px;
  line-height:1.7;
  overflow-wrap:anywhere;
}
.message.error { color:var(--red); }

@media(max-width:360px) {
  .app { padding:10px; }
  .login-card { padding:36px 18px 25px; }
  .reel-card { padding:11px; }
  .reels { gap:4px; }
}
</style>
</head>

<body>
<div class="app">

  <main id="loginScreen" class="screen">
    <section class="card login-card">
      <div class="eyebrow">WELCOME TO</div>
      <div class="brand">KIMIA</div>
      <div class="brand-sub">PRIVÉ</div>
      <div class="ornament"><span class="diamond"></span></div>
      <p class="description">
        An exclusive private gaming experience.
        Your Telegram identity connects directly
        to your PRIVÉ account.
      </p>
      <button id="loginBtn" class="primary-btn">ENTER PRIVÉ</button>
      <div id="loginStatus" class="status" role="status" aria-live="polite"></div>
    </section>
  </main>

  <main id="gameScreen" class="screen game-screen hidden">
    <div class="topbar">
      <div class="logo-small">KIMIA PRIVÉ</div>
      <div id="vipBadge" class="vip">PRIVÉ</div>
    </div>

    <section class="card balance-card">
      <div>
        <div class="balance-label">PRIVATE BALANCE</div>
        <div id="balance" class="balance">0</div>
      </div>
      <div id="playerName" class="balance-label">MEMBER</div>
    </section>

    <section class="card reel-card">
      <div id="reels" class="reels"></div>
      <div class="controls">
        <div class="bet-row">
          <button class="bet-btn active" data-bet="300">300</button>
          <button class="bet-btn" data-bet="600">600</button>
          <button class="bet-btn" data-bet="1500">1,500</button>
          <button class="bet-btn" data-bet="3000">3,000</button>
        </div>
        <button id="spinBtn" class="spin-btn">SPIN</button>
        <div id="gameMessage" class="message" role="status" aria-live="polite"></div>
      </div>
    </section>
  </main>

</div>

<script>
(function () {
  "use strict";

  const API_BASE = ""; // Same Render service serves index.html and /api.
  const tg = window.Telegram && window.Telegram.WebApp
    ? window.Telegram.WebApp
    : null;

  if (tg) {
    try {
      tg.ready();
      tg.expand();
    } catch (error) {
      console.warn("Telegram initialization:", error);
    }
  }

  const $ = id => document.getElementById(id);
  const loginScreen = $("loginScreen");
  const gameScreen = $("gameScreen");
  const loginBtn = $("loginBtn");
  const loginStatus = $("loginStatus");
  const balanceEl = $("balance");
  const playerNameEl = $("playerName");
  const vipBadge = $("vipBadge");
  const reelsEl = $("reels");
  const spinBtn = $("spinBtn");
  const gameMessage = $("gameMessage");

  const SYMBOLS = ["💎", "7️⃣", "💗", "🌹", "♠️", "✨"];
  let selectedBet = 300;
  let currentPlayer = null;
  let loggingIn = false;
  let spinning = false;

  function setStatus(message, ok) {
    loginStatus.textContent = message || "";
    loginStatus.classList.toggle("ok", Boolean(ok));
  }

  function setGameMessage(message, error) {
    gameMessage.textContent = message || "";
    gameMessage.classList.toggle("error", Boolean(error));
  }

  function getInitData() {
    if (!tg) {
      throw new Error(
        "Telegram Web App is unavailable. Open KIMIA PRIVÉ from your Telegram bot's menu button."
      );
    }

    if (!tg.initData || !tg.initData.trim()) {
      throw new Error(
        "Telegram login data is missing. Open the game inside Telegram, not in a regular browser."
      );
    }

    return tg.initData;
  }

  async function apiPost(endpoint, body) {
    let response;

    try {
      response = await fetch(API_BASE + endpoint, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Accept": "application/json"
        },
        body: JSON.stringify(body),
        cache: "no-store"
      });
    } catch (error) {
      throw new Error(
        "Could not reach the game server. Check your connection and try again."
      );
    }

    const responseText = await response.text();
    let data = null;

    if (responseText.trim()) {
      try {
        data = JSON.parse(responseText);
      } catch {
        if (response.status === 404) {
          throw new Error(
            "API route not found (404). Confirm this page is served by the same Render service as server.js."
          );
        }

        throw new Error(
          `Server returned non-JSON content (HTTP ${response.status}). Check the Render service and deployment logs.`
        );
      }
    }

    if (!response.ok) {
      const message = data && typeof data.error === "string"
        ? data.error
        : `Server request failed (HTTP ${response.status}).`;

      throw new Error(message);
    }

    if (!data || typeof data !== "object" || Array.isArray(data)) {
      throw new Error(
        "Server returned an empty or invalid response. Check Render logs for the /api request."
      );
    }

    return data;
  }

  function updatePlayer(player) {
    const balance = Number(player.balance);

    if (!Number.isFinite(balance)) {
      throw new Error("The server returned an invalid account balance.");
    }

    balanceEl.textContent = balance.toLocaleString("en-US");

    let name = typeof player.username === "string" && player.username.trim()
      ? player.username.trim()
      : "PRIVÉ MEMBER";

    if (name.startsWith("@")) name = name.slice(1);
    playerNameEl.textContent = name.toUpperCase();

    const vip = Number(player.vipLevel || 0);
    vipBadge.textContent = vip > 0 ? `VIP ${vip}` : "PRIVÉ";
  }

  async function login() {
    if (loggingIn) return;

    loggingIn = true;
    loginBtn.disabled = true;
    loginBtn.textContent = "CONNECTING…";
    setStatus("SECURELY CONNECTING TO PRIVÉ…", true);

    try {
      const initData = getInitData();
      const data = await apiPost("/api/me", { initData });

      if (data.id === undefined || data.id === null || data.balance === undefined) {
        console.error("Unexpected /api/me response:", data);
        throw new Error(
          "Account response is missing id or balance. Check the deployed server.js version."
        );
      }

      updatePlayer(data);
      currentPlayer = data;

      loginScreen.classList.add("hidden");
      gameScreen.classList.remove("hidden");

      setGameMessage("WELCOME TO PRIVÉ");
      renderSymbols([
        "💎", "7️⃣", "💗", "🌹", "♠️",
        "✨", "💎", "♥", "🌹", "♠",
        "7️⃣", "💗", "✨", "💎", "🌹"
      ]);
    } catch (error) {
      console.error("KIMIA PRIVÉ login failed:", error);
      setStatus(error && error.message ? error.message : "Login failed.", false);
    } finally {
      loggingIn = false;
      loginBtn.disabled = false;
      loginBtn.textContent = "ENTER PRIVÉ";
    }
  }

  function symbolClass(symbol) {
    if (symbol === "💎") return "symbol-diamond";
    if (symbol === "7️⃣") return "symbol-seven";
    if (symbol === "💗") return "symbol-heart";
    if (symbol === "🌹") return "symbol-rose";
    if (symbol === "♠️" || symbol === "♠") return "symbol-spade";
    return "symbol-star";
  }

  function symbolMarkup(symbol) {
    const artwork = {
      "💎": "◆",
      "7️⃣": "7",
      "💗": "♥",
      "🌹": "✿",
      "♠️": "♠",
      "♠": "♠",
      "✨": "✦",
      "♥": "♥"
    };

    const art = artwork[symbol] || "✦";
    return `<div class="symbol ${symbolClass(symbol)}"><span class="symbol-art">${art}</span></div>`;
  }

  function renderSymbols(symbols) {
    const valid = Array.isArray(symbols) && symbols.length === 15;
    const values = valid ? symbols : Array(15).fill("✨");
    reelsEl.replaceChildren();

    values.forEach(symbol => {
      const reel = document.createElement("div");
      reel.className = "reel";
      reel.innerHTML = symbolMarkup(symbol);
      reelsEl.appendChild(reel);
    });
  }

  function selectBet(button) {
    if (spinning) return;

    document.querySelectorAll(".bet-btn").forEach(item => {
      item.classList.toggle("active", item === button);
    });

    selectedBet = Number(button.dataset.bet);
    setGameMessage(`BET ${selectedBet.toLocaleString("en-US")}`);
  }

  document.querySelectorAll(".bet-btn").forEach(button => {
    button.addEventListener("click", () => selectBet(button));
  });

  async function spin() {
    if (spinning || !currentPlayer) return;

    spinning = true;
    spinBtn.disabled = true;
    spinBtn.textContent = "SPINNING…";
    setGameMessage("");

    let animation;
    try {
      const initData = getInitData();

      animation = setInterval(() => {
        renderSymbols(Array.from(
          { length: 15 },
          () => SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)]
        ));
      }, 100);

      const data = await apiPost("/api/spin", {
        initData,
        bet: selectedBet
      });

      if (!Array.isArray(data.symbols) || data.symbols.length !== 15) {
        throw new Error("Spin response is missing the 15 reel symbols.");
      }

      if (data.balance === undefined || !Number.isFinite(Number(data.balance))) {
        throw new Error("Spin response is missing a valid balance.");
      }

      clearInterval(animation);
      animation = null;
      renderSymbols(data.symbols);

      currentPlayer = {
        ...currentPlayer,
        balance: Number(data.balance),
        vipLevel: data.vipLevel ?? currentPlayer.vipLevel,
        username: data.username ?? currentPlayer.username
      };

      updatePlayer(currentPlayer);

      const win = Number(data.win || 0);
      setGameMessage(
        win > 0
          ? `WIN · ${win.toLocaleString("en-US")} PRIVÉ COINS`
          : "NO WIN · TRY AGAIN"
      );

      if (tg && win > 0) {
        try { tg.HapticFeedback.notificationOccurred("success"); } catch {}
      }
    } catch (error) {
      if (animation) clearInterval(animation);
      console.error("KIMIA PRIVÉ spin failed:", error);
      setGameMessage(error && error.message ? error.message : "Spin failed.", true);
    } finally {
      spinning = false;
      spinBtn.disabled = false;
      spinBtn.textContent = "SPIN";
    }
  }

  loginBtn.addEventListener("click", login);
  spinBtn.addEventListener("click", spin);

  renderSymbols([
    "💎", "7️⃣", "💗", "🌹", "♠️",
    "✨", "💎", "♥", "🌹", "♠",
    "7️⃣", "💗", "✨", "💎", "🌹"
  ]);

  // Only auto-login when Telegram has supplied real Web App initData.
  if (tg && tg.initData && tg.initData.trim()) {
    setTimeout(login, 150);
  } else {
    setStatus(
      "Open this game from your Telegram bot to sign in securely.",
      false
    );
  }
})();
</script>
</body>
</html>
