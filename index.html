.sc-bonus.active{animation:scGlow .7s infinite alternate}
.sc-bets{display:flex;gap:7px;justify-content:center;margin:13px 0}
.sc-bet{flex:1;max-width:120px;padding:11px 4px;border:1px solid #6edbff;border-radius:10px;color:#9feeff;background:#080d20;font:800 12px Montserrat,sans-serif}
.sc-bet.active{background:linear-gradient(#ff9ad6,#ef42a2);border-color:#ffc5eb;color:#1a1028;box-shadow:0 0 13px #ff50b8}
.sc-spin{display:block;width:82%;margin:12px auto 5px;padding:16px 10px;border:2px solid #ffb4e9;border-radius:35px;background:linear-gradient(#ffb0e6,#fa3da5 48%,#a41480);color:#fff4ff;font:900 17px Montserrat,sans-serif;letter-spacing:1px;box-shadow:0 5px 0 #651054,0 0 24px #fa3fbaaa}
.sc-spin:disabled{opacity:.5}
.sc-message{min-height:40px;text-align:center;color:#98edff;font:700 12px Montserrat,sans-serif;line-height:1.5;padding:12px 6px}
.sc-rules{text-align:center;color:#afbed7;font:500 10px Montserrat,sans-serif;line-height:1.7;margin-top:8px}
.sc-after{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:22px;background:radial-gradient(ellipse,#48245dcf,#030a1af5);backdrop-filter:blur(8px);color:#ffcbf1}
.sc-after h2{font:700 42px 'Cormorant Garamond',Georgia,serif;text-shadow:0 0 20px #ff46bb;margin:0}
.sc-after p{color:#9df1ff;font:700 14px Montserrat,sans-serif}
.sc-after button{padding:12px 24px;border-radius:25px;background:#ff6cbd;border:1px solid #ffd0e9;color:#160d1c;font-weight:800}
.sr-lobby-tile[data-game="squirt"]{background:radial-gradient(ellipse at 50% 22%,#302c76,#130b31 55%,#090c1d);border-color:#65d9ff;box-shadow:inset 0 0 16px #ff5abc66,0 0 15px #35cfff44}
.sr-lobby-tile[data-game="squirt"]:before{border-color:#64dfff88}
.sr-lobby-tile[data-game="squirt"] .sr-lobby-art{color:#9df3ff;text-shadow:0 0 18px #ff57c7;font-size:68px}

/* Neon liquid splash particles: purely decorative, never change payouts. */
.sc-splash-layer{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:4;border-radius:25px;contain:paint}
.sc-droplet{position:absolute;left:var(--sx);top:var(--sy);width:var(--sz);height:calc(var(--sz)*1.5);border-radius:70% 45% 65% 50%;background:radial-gradient(circle at 32% 24%,#ffffff 0 8%,var(--drop-color) 33%,#163c91 95%);box-shadow:0 0 10px var(--drop-color),inset -3px -3px 5px #07102b88;opacity:0;transform:translate(-50%,-50%) rotate(var(--rot));animation:scLiquidFly var(--dur) cubic-bezier(.15,.65,.3,1) forwards}
@keyframes scLiquidFly{0%{opacity:0;transform:translate(-50%,-50%) scale(.2) rotate(var(--rot))}12%{opacity:.98}68%{opacity:.85}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.42) rotate(calc(var(--rot) + 110deg))}}
.sc-splash-ring{position:absolute;left:var(--sx);top:var(--sy);width:42px;height:18px;border:4px solid var(--drop-color);border-radius:50%;filter:drop-shadow(0 0 7px var(--drop-color));opacity:0;transform:translate(-50%,-50%) scale(.3);animation:scLiquidRing .72s ease-out forwards}
@keyframes scLiquidRing{10%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(4.5)}}
.sc-reel-frame{isolation:isolate}
.sc-reel-frame:after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:15px;background:linear-gradient(115deg,transparent 22%,#50ecff33 35%,transparent 45%,#ff62cc26 63%,transparent 78%);mix-blend-mode:screen}
.sc-machine.sc-big-win{animation:scCabinetFlash .45s ease-in-out 3}
@keyframes scCabinetFlash{50%{box-shadow:inset 0 0 30px #ff5ddf,0 0 30px #57f4ff,0 0 55px #ff5dcb}}
@media(prefers-reduced-motion:reduce){.sc-droplet,.sc-splash-ring,.sc-machine.sc-big-win{animation:none!important;display:none!important}}

/* AFTER DARK SPLASH: premium dimensional cabinet, matching Spoiled Rotten's polish. */
.sc-screen{max-width:660px;padding:12px 12px 36px;background:radial-gradient(ellipse at 50% 23%,#2e154c60,transparent 70%)}
.sc-machine{border:5px solid transparent;border-radius:37px;padding:23px 16px 29px;background:linear-gradient(#080c21,#080c21) padding-box,linear-gradient(125deg,#a9faff 0%,#233a66 13%,#f6b3ff 27%,#09152c 47%,#52e8ff 68%,#ff8fd5 84%,#09142e 100%) border-box;box-shadow:inset 0 0 0 2px #ff7bc944,inset 8px 0 20px #75ecff17,inset -9px 0 22px #ff5ddc24,0 0 8px #83f5ff,0 0 31px #27c6fa77,0 0 57px #fa2ea950,0 25px 30px #000e;isolation:isolate}
.sc-machine:before{inset:8px;border-radius:27px;border:1px solid #86e9ff88;box-shadow:inset 0 0 25px #c03cf91e;z-index:-1}
.sc-machine:after{content:"";position:absolute;pointer-events:none;inset:14px 15px auto;height:33%;border-radius:25px;background:linear-gradient(125deg,#ffffff16,transparent 38%,#ffb0ec09 60%,transparent);z-index:-1}
.sc-crown{text-align:center;font-size:25px;color:#b7faff;text-shadow:0 0 12px #65eaff,0 0 22px #fb55c5;letter-spacing:5px;margin-bottom:7px}
.sc-logo{font-family:'Cormorant Garamond',Georgia,serif;font-weight:700;font-size:clamp(31px,7.4vw,54px);line-height:.98;letter-spacing:.4px;color:#ffcaed;-webkit-text-stroke:.45px #ffe8ff;text-shadow:0 2px 0 #6b1a77,0 4px 0 #341044,0 6px 5px #000,0 0 15px #ff56c9,0 0 35px #ef25d8}
.sc-tag{font-size:18px;letter-spacing:1px;color:#b5f7ff;text-shadow:0 0 12px #49e9ff;margin:11px 0 22px}
.sc-hud{margin:0 2px 17px;padding:13px 14px;border-radius:15px;border:1px solid #8eeeff;background:linear-gradient(165deg,#253353,#0a0c1d 37%,#150d32 80%,#22314a);box-shadow:inset 0 2px 4px #ffffff26,inset 0 -5px 13px #0008,0 5px 10px #0008,0 0 12px #2ae5ff33}
.sc-hud strong{font-size:20px;color:#fff1ff;text-shadow:0 0 10px #ff7bce}
.sc-reel-shell{position:relative;padding:8px 7px 9px;border:2px solid #89efff;border-radius:21px;background:linear-gradient(130deg,#f4b9f0,#23365e 11%,#10132c 30%,#051328 66%,#9ce6f5 91%,#261136);box-shadow:inset 0 0 0 2px #ff9ae66b,0 0 0 3px #101c3b,0 0 23px #39dfffaa,0 11px 17px #000b}
.sc-reel-marquee,.sc-reel-footer{text-align:center;color:#ffd8f3;font:800 clamp(8px,2vw,11px) Montserrat,sans-serif;letter-spacing:1.5px;text-shadow:0 0 9px #ff4acb;padding:8px 1px}
.sc-reel-footer{color:#9af5ff;text-shadow:0 0 9px #39dfff}
.sc-reel-frame{padding:7px 5px;background:linear-gradient(145deg,#091126,#010611 50%,#201333);border:2px solid #122e4d;border-radius:11px;box-shadow:inset 0 0 13px #000,0 0 10px #70e6ff88}
.sc-reels{gap:4px}
.sc-cell{position:relative;overflow:hidden;border:1px solid #88d6ff70;border-radius:8px;height:clamp(63px,16.5vw,100px);font-size:clamp(27px,8vw,48px);background:radial-gradient(ellipse at 50% 45%,#304873 0%,#101831 55%,#070d1c 100%);box-shadow:inset 0 2px 3px #fff3,inset 0 -9px 12px #0009,0 1px 3px #000b;filter:drop-shadow(0 1px 1px #000)}
.sc-cell:before{content:"";position:absolute;inset:0 0 47%;background:linear-gradient(#ffffff2c,#ffffff06 35%,transparent);border-radius:7px 7px 50% 50%;pointer-events:none}
.sc-cell:after{content:"";position:absolute;inset:auto 10% 4px;height:3px;border-radius:50%;background:#89e7ff33;filter:blur(3px);pointer-events:none}
.sc-symbol-diamond{background:radial-gradient(ellipse,#245d83,#0b1430 75%)}
.sc-symbol-splash{background:radial-gradient(ellipse,#762c9d,#211240 75%)}
.sc-symbol-neon7{background:radial-gradient(ellipse,#71356e,#160d32 75%)}
.sc-symbol-afterhours{background:radial-gradient(ellipse,#216878,#0c1535 75%)}
.sc-symbol-heart{background:radial-gradient(ellipse,#67355d,#1c1030 75%)}
.sc-cell.win{z-index:1;outline:2px solid #ffe9a9;box-shadow:inset 0 0 17px #ff9ddd,0 0 15px #ff55c8}
.sc-bonus{margin:19px 3px 13px;border:1px solid #ffb2e5;border-radius:14px;background:linear-gradient(110deg,#1e1741,#59255d 45%,#0d3753);box-shadow:inset 0 2px 4px #fff2,inset 0 -6px 9px #0008,0 0 12px #ff4ab755;padding:13px 8px}
.sc-bet{padding:14px 4px;border-radius:13px;border:1px solid #83e7ff;background:linear-gradient(#253457,#0b1025 47%,#05091a);box-shadow:inset 0 1px 3px #fff2,0 4px 0 #060a17,0 0 8px #25dcff33}
.sc-bet.active{background:linear-gradient(#ffe4f8,#ff80c8 45%,#d42b91);box-shadow:inset 0 2px 2px #fff9,0 4px 0 #611449,0 0 15px #ff58b9}
.sc-spin{position:relative;margin-top:20px;padding:18px 6px;border:2px solid #ffddf4;background:linear-gradient(#ffe0f6,#ff80d3 21%,#f72aab 52%,#9d116c);border-radius:50px;color:white;text-shadow:0 2px 3px #580e56;box-shadow:inset 0 3px 3px #fff9,inset 0 -6px 10px #620e57,0 6px 0 #4e0c48,0 10px 15px #000b,0 0 25px #ff49be;transition:transform .15s,filter .15s}
.sc-spin:active{transform:translateY(4px);box-shadow:inset 0 2px 7px #560d5d,0 2px 0 #4e0c48,0 0 23px #ff49be}
.sc-message{text-shadow:0 0 8px #48e6ff}
.sc-after{background:radial-gradient(ellipse,#651a75ec,#070d25f7 75%)}
.sc-after h2{font-size:clamp(44px,12vw,76px);color:#ffd1f0;text-shadow:0 3px 0 #682268,0 0 28px #ff3ca8,0 0 55px #4bdcff}
@media(max-width:380px){.sc-machine{padding:20px 9px 25px}.sc-reel-shell{padding:6px 4px}.sc-reel-frame{padding:5px 3px}.sc-reels{gap:3px}.sc-cell{height:61px}.sc-logo{font-size:29px}}
@media(prefers-reduced-motion:reduce){.sc-spin,.sc-cell{transition:none}}

.sc-back{position:relative;z-index:1;background:linear-gradient(#17243f,#070b1a);border:1px solid #9eefff;color:#d2faff;box-shadow:0 0 12px #52ddff77}
.sc-machine{max-width:680px;margin:8px auto 0;border-width:7px;border-radius:46px;background:linear-gradient(155deg,#101a35,#080b1d 40%,#17122c 80%) padding-box,linear-gradient(122deg,#ffffff,#46bfe6 9%,#091a36 19%,#ffc7f5 29%,#283f5e 41%,#060e22 52%,#85f5ff 70%,#f78bd6 86%,#15254c) border-box;box-shadow:inset 0 0 0 3px #8aeaff5e,inset 14px 0 30px #1bc6ff22,inset -14px 0 30px #ff51c72b,0 0 25px #56dbffbb,0 0 60px #f447a34d,0 34px 30px #000e}
.sc-machine:before{inset:9px;border-radius:34px;box-shadow:inset 0 0 18px #ff54b43d}
.sc-reel-shell{border-width:4px;border-radius:24px;box-shadow:inset 0 0 0 3px #fff5,0 0 0 4px #050b1d,0 0 22px #64e7ff,0 18px 28px #000d}
.sc-cell{border-radius:5px;background:linear-gradient(100deg,#0a1125,#26324b 12%,#080b19 28%,#171b32 80%,#0b1129);box-shadow:inset 3px 0 6px #0009,inset -3px 0 5px #ffffff18,inset 0 3px 5px #d7faff2c,inset 0 -5px 8px #0009;isolation:isolate}
.sc-cell:before{z-index:2;opacity:.6}
.sc-gem{display:block;width:88%;height:88%;object-fit:contain;filter:drop-shadow(0 4px 2px #000c) drop-shadow(0 0 7px #ff79d16e);pointer-events:none;user-select:none}
.sc-cell.wild .sc-gem{filter:drop-shadow(0 0 8px #69eeff) drop-shadow(0 0 10px #f65cca)}
.sc-cell.scatter .sc-gem{filter:drop-shadow(0 0 9px #ff8bd9)}
.sc-logo{font-size:clamp(30px,6.8vw,57px);text-shadow:0 1px 0 #fff,0 3px 0 #90248d,0 6px 3px #190e2d,0 0 16px #f14cc3,0 0 33px #2cddff}
.sc-hud{border:2px solid #a9f8ff;box-shadow:inset 0 2px 4px #ffffff36,inset 0 -6px 10px #000c,0 0 15px #60dfff55}
.sc-bonus{font-size:clamp(9px,2.5vw,13px);letter-spacing:.5px}
@media(max-width:420px){.sc-screen{padding:10px 5px 40px}.sc-machine{padding:16px 7px 23px;border-width:4px;border-radius:30px}.sc-reel-shell{padding:5px 3px;border-width:2px}.sc-reel-frame{padding:4px 2px}.sc-reels{gap:2px}.sc-cell{height:clamp(51px,16vw,70px)}.sc-logo{font-size:clamp(27px,7vw,38px)}.sc-hud{padding:9px}}

/* VISIBLE LIQUID SHOW: sweeping jets across the reel glass, not just tiny particles */
.sc-reel-frame{overflow:visible;position:relative}
.sc-water-show{position:absolute;inset:-20px -10px;z-index:12;pointer-events:none;overflow:visible;filter:drop-shadow(0 0 9px #37edff) drop-shadow(0 0 14px #fa5ed4)}
.sc-water-show svg{width:100%;height:100%;overflow:visible}
.sc-water-show .sc-jet{fill:none;stroke:url(#scJetGradient);stroke-width:23;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1100;stroke-dashoffset:1100;animation:scJetSweep 1.25s cubic-bezier(.16,.72,.22,1) forwards}
.sc-water-show .sc-jet.sc-jet2{stroke-width:13;animation-delay:.13s;animation-duration:1.35s}
.sc-water-show .sc-foam{fill:#c7ffff;stroke:#61ecff;stroke-width:2;opacity:0;animation:scFoamBloom 1.15s ease-out forwards}
.sc-water-show .sc-bubble{fill:#8ffaff;stroke:#fff;stroke-width:1;opacity:0;animation:scBubbleRise 1.2s ease-out forwards;animation-delay:var(--delay)}
.sc-water-show.sc-win-water{filter:drop-shadow(0 0 15px #7afaff) drop-shadow(0 0 24px #ff6be5)}
.sc-water-show.sc-win-water .sc-jet{stroke-width:34;animation-duration:1.6s}
@keyframes scJetSweep{0%{stroke-dashoffset:1100;opacity:0}12%{opacity:1}66%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:-1050;opacity:0}}
@keyframes scFoamBloom{0%{opacity:0;transform:scale(.25);transform-origin:center}30%{opacity:.95}100%{opacity:0;transform:scale(2.3);transform-origin:center}}
@keyframes scBubbleRise{0%{opacity:0;transform:translateY(25px) scale(.2)}20%{opacity:.95}100%{opacity:0;transform:translateY(-140px) scale(1.6)}}
.sc-reel-frame.sc-wet-glass{animation:scWetGlass 1.2s ease-out}
@keyframes scWetGlass{25%{box-shadow:inset 0 0 60px #65f6ff,0 0 25px #ff65d9}100%{box-shadow:inset 0 0 0 transparent}}
@media(prefers-reduced-motion:reduce){.sc-water-show{display:none!important}}

/* Full-screen water impact, layered above the entire casino on each Squirt City spin. */
#scScreenFlood{position:fixed;inset:0;z-index:2147483000;pointer-events:none;overflow:hidden;isolation:isolate}
#scScreenFlood .sc-flood-svg{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 0 9px #4eeaff) drop-shadow(0 0 16px #ff64d8)}
#scScreenFlood .sc-flood-jet{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1100;stroke-dashoffset:1100;animation:scFloodJet 1.4s cubic-bezier(.15,.3,.1,1) forwards}
#scScreenFlood .sc-flood-drop{transform-box:fill-box;transform-origin:center;animation:scFloodDrop 1.6s ease-out both}
#scScreenFlood .sc-flood-sheen{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 53%,#d5ffff8c 0%,#46dfff42 25%,#ff66cb26 55%,transparent 75%);animation:scFloodSheen 1.8s ease-out both;mix-blend-mode:screen}
#scScreenFlood .sc-flood-sheet{position:absolute;inset:-20%;background:linear-gradient(105deg,transparent 15%,#53edff44 31%,#ffffff70 42%,#ff63ce59 53%,transparent 70%);transform:translateY(-120%) rotate(-9deg);animation:scFloodSheet 1.7s ease-out both;mix-blend-mode:screen}
@keyframes scFloodJet{0%{stroke-dashoffset:1100;opacity:0}8%{opacity:1}60%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:-280;opacity:0}}
